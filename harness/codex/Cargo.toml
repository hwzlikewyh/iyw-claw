[package]
name = "iyw-codex-harness"
version = "0.1.0"
description = "Codex App Server integration boundary for iyw-claw"
license = "Apache-2.0"
edition = "2021"
publish = false
readme = "README.md"

[features]
default = []
upstream = [
    "dep:codex-app-server-client",
    "dep:codex-app-server-protocol",
    "dep:codex-apply-patch",
    "dep:codex-arg0",
    "dep:codex-config",
    "dep:codex-core",
    "dep:codex-exec-server",
    "dep:codex-feedback",
    "dep:codex-protocol",
    "dep:codex-linux-sandbox",
    "dep:codex-sandboxing",
    "dep:codex-utils-absolute-path",
    "dep:codex-utils-path-uri",
    "dep:codex-windows-sandbox",
    "dep:rama-error",
    "dep:rama-macros",
    "dep:rama-utils",
    "dep:serde_json",
    "dep:tokio",
]
upstream-acp = ["upstream", "dep:sacp"]

[dependencies]
codex-app-server-client = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-app-server-client", optional = true }
codex-app-server-protocol = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-app-server-protocol", optional = true }
codex-apply-patch = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-apply-patch", optional = true }
codex-arg0 = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-arg0", optional = true }
codex-config = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-config", optional = true }
codex-core = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-core", optional = true }
codex-exec-server = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-exec-server", optional = true }
codex-feedback = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-feedback", optional = true }
codex-protocol = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-protocol", optional = true }
codex-linux-sandbox = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-linux-sandbox", optional = true }
codex-sandboxing = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-sandboxing", optional = true }
codex-utils-absolute-path = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-utils-absolute-path", optional = true }
codex-utils-path-uri = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-utils-path-uri", optional = true }
codex-windows-sandbox = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-windows-sandbox", optional = true }
rama-error = { version = "=0.3.0-alpha.4", optional = true }
rama-macros = { version = "=0.3.0-alpha.4", optional = true }
rama-utils = { version = "=0.3.0-alpha.4", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "io-std", "macros"], optional = true }
sacp = { version = "11.0.0", optional = true }

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92", version = "0.29.0" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

# Windows builds of the locked upstream release need two `HANDLE`/pointer
# casts under the current windows-sys graph. This local crate preserves the
# upstream source plus only those compatibility fixes; remove it when a
# subsequent locked Codex release incorporates an equivalent fix.
[patch."https://github.com/openai/codex.git"]
codex-utils-pty = { path = "patches/codex-utils-pty" }
