[package]
edition = "2024"
license = "Apache-2.0"
name = "codex-utils-pty"
version = "0.155.0"

[lib]
doctest = false

[dependencies.anyhow]
version = "1"

[dependencies.portable-pty]
version = "0.9.0"

[dependencies.tokio]
version = "1"
features = [ "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time",]

[target."cfg(windows)".dependencies.filedescriptor]
version = "0.8.3"

[target."cfg(windows)".dependencies.lazy_static]
version = "1"

[target."cfg(windows)".dependencies.log]
version = "0.4"

[target."cfg(windows)".dependencies.shared_library]
version = "0.1.9"

[target."cfg(windows)".dependencies.winapi]
version = "0.3.9"
features = [ "handleapi", "jobapi", "jobapi2", "libloaderapi", "minwinbase", "processthreadsapi", "synchapi", "winbase", "wincon", "winerror", "winnt",]

[target."cfg(unix)".dependencies.libc]
version = "0.2.182"
