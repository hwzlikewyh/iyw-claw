[package]
name = "codex-code-mode"
version = "0.156.1"
edition = "2024"
license = "Apache-2.0"
autobins = false
autotests = false
autobenches = false

[lib]
doctest = false
name = "codex_code_mode"
path = "src/lib.rs"

[dependencies.codex-code-mode-protocol]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-http-client]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-install-context]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-otel]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-protocol]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.futures]
version = "0.3"
default-features = false

[dependencies.http-body-util]
version = "0.1.3"

[dependencies.prost]
version = "0.14.3"

[dependencies.reqwest]
version = "0.12"
features = [ "cookies", "stream",]

[dependencies.serde_json]
version = "1"

[dependencies.tokio]
version = "1"
features = [ "io-util", "macros", "net", "process", "rt", "sync", "time",]

[dependencies.tokio-util]
version = "0.7.18"
features = [ "rt",]

[dependencies.tonic]
version = "0.14.3"
default-features = false
features = [ "channel", "codegen",]

[dependencies.tower]
version = "0.5.3"
features = [ "util",]

[dependencies.tracing]
version = "0.1.44"

[dependencies.uuid]
version = "1"
features = [ "v4",]
