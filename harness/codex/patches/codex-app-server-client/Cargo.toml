[package]
name = "codex-app-server-client"
version = "0.156.1"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "codex_app_server_client"
path = "src/lib.rs"
doctest = false

[dependencies]
codex-app-server = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
codex-config = { workspace = true }
codex-core = { workspace = true }
codex-exec-server = { workspace = true }
codex-feedback = { workspace = true }
codex-protocol = { workspace = true }
codex-uds = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[workspace]

[workspace.package]
version = "0.156.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
codex-app-server = { path = "../codex-app-server" }
codex-app-server-protocol = { path = "../codex-app-server-protocol" }
codex-arg0 = { git = "https://github.com/openai/codex.git", rev = "b412ff32c417f855c2b2d1581b77058eed87c84b", package = "codex-arg0" }
codex-config = { git = "https://github.com/openai/codex.git", rev = "b412ff32c417f855c2b2d1581b77058eed87c84b", package = "codex-config" }
codex-core = { path = "../codex-core" }
codex-exec-server = { path = "../codex-exec-server" }
codex-feedback = { git = "https://github.com/openai/codex.git", rev = "b412ff32c417f855c2b2d1581b77058eed87c84b", package = "codex-feedback" }
codex-protocol = { path = "../codex-protocol" }
codex-uds = { git = "https://github.com/openai/codex.git", rev = "b412ff32c417f855c2b2d1581b77058eed87c84b", package = "codex-uds" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex.git", rev = "b412ff32c417f855c2b2d1581b77058eed87c84b", package = "codex-utils-absolute-path" }
codex-utils-rustls-provider = { git = "https://github.com/openai/codex.git", rev = "b412ff32c417f855c2b2d1581b77058eed87c84b", package = "codex-utils-rustls-provider" }
futures = { version = "0.3", default-features = false }
serde = { version = "1", features = ["rc"] }
serde_json = "1"
tokio = "1"
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186", features = ["proxy", "rustls-tls-native-roots"] }
toml = "0.9.5"
tracing = "0.1.44"
url = "2"
