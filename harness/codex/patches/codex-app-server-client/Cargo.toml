[package]
name = "codex-app-server-client"
version = "0.164.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "codex_app_server_client"
path = "src/lib.rs"
doctest = false

[dependencies.codex-app-server]
git = "https://github.com/openai/codex.git"
rev = "6aaac694803004a63c6f393d153c96d22521a6b9"

[dependencies.codex-app-server-protocol]
git = "https://github.com/openai/codex.git"
rev = "6aaac694803004a63c6f393d153c96d22521a6b9"

[dependencies.codex-arg0]
git = "https://github.com/openai/codex.git"
rev = "6aaac694803004a63c6f393d153c96d22521a6b9"

[dependencies.codex-config]
git = "https://github.com/openai/codex.git"
rev = "6aaac694803004a63c6f393d153c96d22521a6b9"

[dependencies.codex-core]
git = "https://github.com/openai/codex.git"
rev = "6aaac694803004a63c6f393d153c96d22521a6b9"

[dependencies.codex-exec-server]
git = "https://github.com/openai/codex.git"
rev = "6aaac694803004a63c6f393d153c96d22521a6b9"

[dependencies.codex-feedback]
git = "https://github.com/openai/codex.git"
rev = "6aaac694803004a63c6f393d153c96d22521a6b9"

[dependencies.codex-protocol]
git = "https://github.com/openai/codex.git"
rev = "6aaac694803004a63c6f393d153c96d22521a6b9"

[dependencies.codex-uds]
git = "https://github.com/openai/codex.git"
rev = "6aaac694803004a63c6f393d153c96d22521a6b9"

[dependencies.codex-utils-absolute-path]
git = "https://github.com/openai/codex.git"
rev = "6aaac694803004a63c6f393d153c96d22521a6b9"

[dependencies.codex-utils-rustls-provider]
git = "https://github.com/openai/codex.git"
rev = "6aaac694803004a63c6f393d153c96d22521a6b9"

[dependencies.futures]
version = "0.3"
default-features = false

[dependencies.serde]
version = "1"
features = [ "rc",]

[dependencies.serde_json]
version = "1"

[dependencies.tokio]
version = "1"
features = [ "sync", "time", "rt",]

[dependencies.tokio-tungstenite]
git = "https://github.com/openai-oss-forks/tokio-tungstenite"
rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186"
features = [ "proxy", "rustls-tls-native-roots",]

[dependencies.toml]
version = "0.9.5"

[dependencies.tracing]
version = "0.1.44"

[dependencies.url]
version = "2"
