[package]
name = "codex-rollout"
version = "0.156.1"
edition = "2024"
license = "Apache-2.0"
autobins = false
autotests = false
autobenches = false

[lib]
doctest = false
name = "codex_rollout"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1"

[dependencies.chrono]
version = "0.4.43"
features = [ "serde",]

[dependencies.codex-extension-items]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-file-search]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-git-utils]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-history]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-otel]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-protocol]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-state]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-utils-absolute-path]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.codex-utils-path]
git = "https://github.com/openai/codex.git"
rev = "b412ff32c417f855c2b2d1581b77058eed87c84b"

[dependencies.regex]
version = "1.12.3"

[dependencies.serde]
version = "1"
features = [ "rc", "derive",]

[dependencies.serde_json]
version = "1"

[dependencies.tempfile]
version = "3.23.0"

[dependencies.time]
version = "0.3.47"
features = [ "formatting", "local-offset", "macros", "parsing",]

[dependencies.tokio]
version = "1"
features = [ "fs", "io-util", "macros", "process", "rt", "sync", "time",]

[dependencies.tracing]
version = "0.1.44"

[dependencies.uuid]
version = "1"

[dependencies.zstd]
version = "0.13"
