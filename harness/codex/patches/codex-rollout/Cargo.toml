[package]
name = "codex-rollout"
version = "0.153.4"
edition = "2024"
license = "Apache-2.0"
autobins = false
autotests = false
autobenches = false

[lib]
doctest = false
name = "codex_rollout"
path = "src/lib.rs"

[dependencies."anyhow"]
version = "^1"

[dependencies."chrono"]
version = "^0.4.43"
features = ["serde"]

[dependencies."codex-extension-items"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-file-search"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-git-utils"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-history"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-otel"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-protocol"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-state"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-utils-absolute-path"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-utils-path"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."regex"]
version = "^1.12.3"

[dependencies."serde"]
version = "^1"
features = ["rc","derive"]

[dependencies."serde_json"]
version = "^1"

[dependencies."tempfile"]
version = "^3.23.0"

[dependencies."time"]
version = "^0.3.47"
features = ["formatting","local-offset","macros","parsing"]

[dependencies."tokio"]
version = "^1"
features = ["fs","io-util","macros","process","rt","sync","time"]

[dependencies."tracing"]
version = "^0.1.44"

[dependencies."uuid"]
version = "^1"

[dependencies."zstd"]
version = "^0.13"
