[package]
name = "codex-login"
version = "0.171.0"
edition = "2024"
license = "Apache-2.0"
autobins = false
autotests = false
autobenches = false

[lib]
doctest = false
name = "codex_login"
path = "src/lib.rs"

[dependencies.codex-utils-process]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.anyhow]
version = "1"

[dependencies.base64]
version = "0.22.1"

[dependencies.chrono]
version = "0.4.43"
features = [ "serde",]

[dependencies.codex-agent-identity]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-http-client]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-config]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-keyring-store]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-model-provider-info]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-otel]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-protocol]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-secrets]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-terminal-detection]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-utils-path]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-utils-template]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-workload-identity]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.http]
version = "1.3.1"

[dependencies.oauth2]
version = "5"
default-features = false

[dependencies.once_cell]
version = "1.20.2"

[dependencies.os_info]
version = "3.12.0"

[dependencies.rand]
version = "0.9"

[dependencies.serde]
version = "1"
features = [ "rc", "derive",]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.tempfile]
version = "3.23.0"

[dependencies.thiserror]
version = "2.0.17"

[dependencies.tiny_http]
version = "0.12"

[dependencies.tokio]
version = "1"
features = [ "io-std", "macros", "process", "rt-multi-thread", "signal",]

[dependencies.tracing]
version = "0.1.44"

[dependencies.url]
version = "2"

[dependencies.urlencoding]
version = "2.1"

[dependencies.webbrowser]
version = "1.2.2"

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
features = [ "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",]
