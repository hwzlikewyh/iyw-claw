[dependencies."rand"]
version = "^0.9"

[dependencies."serde"]
version = "^1"
features = ["rc","derive"]

[dependencies."serde_json"]
version = "^1"

[dependencies."sha2"]
version = "^0.10"

[dependencies."thiserror"]
version = "^2.0.17"

[dependencies."tiny_http"]
version = "^0.12"

[dependencies."tokio"]
