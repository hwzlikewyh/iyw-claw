[package]
name = "codex-login"
version = "0.153.4"
edition = "2024"
license = "Apache-2.0"
autobins = false
autotests = false
autobenches = false

[lib]
doctest = false
name = "codex_login"
path = "src/lib.rs"

[dependencies."base64"]
version = "^0.22.1"

[dependencies."chrono"]
version = "^0.4.43"
features = ["serde"]

[dependencies."codex-agent-identity"]
