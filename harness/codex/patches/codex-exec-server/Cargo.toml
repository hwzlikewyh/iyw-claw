[package.metadata.cargo-shear]
ignored-paths = [ "tests/unit/client_provisioning_tests.rs", "src/discoverV2/tests/capability_watchers_tests.rs",]

[target."cfg(unix)".dependencies.codex-uds]
git = "https://github.com/openai/codex.git"
