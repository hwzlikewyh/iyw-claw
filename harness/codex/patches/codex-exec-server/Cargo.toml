[package]
name = "codex-exec-server"
version = "0.161.0"
edition = "2024"
license = "Apache-2.0"
autobins = false
autotests = false
autobenches = false

[lib]
doctest = false
name = "codex_exec_server"
path = "src/lib.rs"

[dependencies.codex-utils-process]
git = "https://github.com/openai/codex.git"
rev = "979011409de0a60b52f179721948e65531d26144"

