[package]
name = "codex-rmcp-client"
version = "0.153.4"
edition = "2024"
license = "Apache-2.0"
autobins = false
autotests = false
autobenches = false

[lib]
doctest = false
name = "codex_rmcp_client"
path = "src/lib.rs"

[dependencies."anyhow"]
version = "^1"

[dependencies."axum"]
version = "^0.8"
default-features = false
features = ["http1","json","tokio"]

[dependencies."base64"]
version = "^0.22.1"

[dependencies."bytes"]
version = "^1.10.1"

[dependencies."codex-api"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-config"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-exec-server"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-http-client"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-keyring-store"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-network-proxy"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-protocol"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-secrets"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-utils-home-dir"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-utils-path-uri"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."codex-utils-pty"]
version = "*"
git = "https://github.com/openai/codex.git"
rev = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

[dependencies."futures"]
version = "^0.3"
default-features = false
features = ["std"]

[dependencies."http"]
version = "^1.3.1"

[dependencies."keyring"]
version = "^3.6"
default-features = false
features = ["crypto-rust"]

[dependencies."memchr"]
version = "^2.7.6"

[dependencies."oauth2"]
version = "^5"

[dependencies."rmcp"]
version = "=3.1.3"
default-features = false
features = ["auth","base64","client","macros","schemars","server","transport-async-rw","transport-child-process","transport-streamable-http-client","transport-streamable-http-server"]

[dependencies."serde"]
version = "^1"
features = ["rc","derive"]

[dependencies."serde_json"]
version = "^1"

[dependencies."sha2"]
version = "^0.10"

[dependencies."sse-stream"]
version = "^0.2.5"

[dependencies."thiserror"]
version = "^2.0.17"

[dependencies."tiny_http"]
version = "^0.12"

[dependencies."tokio"]
version = "^1"
features = ["io-util","macros","process","signal","rt-multi-thread","sync","io-std","time"]

[dependencies."tracing"]
version = "^0.1.44"
features = ["log"]

[dependencies."url"]
version = "^2"

[dependencies."urlencoding"]
version = "^2.1"

[dependencies."webbrowser"]
version = "^1.2.2"

[dependencies."which"]
version = "^8"

[target."cfg(any(target_os = \"freebsd\", target_os = \"openbsd\"))".dependencies."keyring"]
version = "^3.6"
default-features = false
features = ["sync-secret-service"]

[target."cfg(target_os = \"linux\")".dependencies."keyring"]
version = "^3.6"
default-features = false
features = ["linux-native-async-persistent"]

[target."cfg(target_os = \"macos\")".dependencies."keyring"]
version = "^3.6"
default-features = false
features = ["apple-native"]

[target."cfg(target_os = \"windows\")".dependencies."keyring"]
version = "^3.6"
default-features = false
features = ["windows-native"]

[target."cfg(target_os = \"windows\")".dependencies."windows-sys"]
version = "^0.52"
features = ["Win32_Storage_FileSystem"]

[target."cfg(unix)".dependencies."libc"]
version = "^0.2.182"
