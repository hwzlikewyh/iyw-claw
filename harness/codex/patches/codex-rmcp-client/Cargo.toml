[package]
name = "codex-rmcp-client"
version = "0.171.0"
edition = "2024"
license = "Apache-2.0"
autobins = false
autotests = false
autobenches = false

[lib]
doctest = false
name = "codex_rmcp_client"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1"

[dependencies.axum]
version = "0.8"
default-features = false
features = [ "http1", "json", "tokio",]

[dependencies.base64]
version = "0.22.1"

[dependencies.codex-api]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-config]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-exec-server]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-http-client]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-http-headers-helper]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-keyring-store]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-network-proxy]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-otel]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-protocol]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-secrets]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-utils-path-uri]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-utils-pty]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.codex-utils-home-dir]
git = "https://github.com/openai/codex.git"
rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e"

[dependencies.bytes]
version = "1.10.1"

[dependencies.futures]
version = "0.3"
default-features = false
features = [ "std",]

[dependencies.http]
version = "1.3.1"

[dependencies.keyring]
version = "3.6"
default-features = false
features = [ "crypto-rust",]

[dependencies.memchr]
version = "2.7.6"

[dependencies.oauth2]
version = "5"

[dependencies.rmcp]
git = "https://github.com/modelcontextprotocol/rust-sdk"
rev = "b11a40d889e022087d7f2b8cd23aa28e19ceaf5b"
version = "=3.6.0"
default-features = false
features = [ "auth-enterprise-managed", "base64", "client", "macros", "schemars", "server", "transport-async-rw", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-server",]

[dependencies.serde]
version = "1"
features = [ "rc", "derive",]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.sse-stream]
version = "0.2.5"

[dependencies.tempfile]
version = "3.23.0"

[dependencies.thiserror]
version = "2.0.17"

[dependencies.tiny_http]
version = "0.12"

[dependencies.tokio]
version = "1"
features = [ "io-util", "macros", "net", "process", "signal", "rt-multi-thread", "sync", "io-std", "time",]

[dependencies.tokio-util]
version = "0.7.18"
features = [ "rt",]

[dependencies.tracing]
version = "0.1.44"
features = [ "log",]

[dependencies.url]
version = "2"

[dependencies.urlencoding]
version = "2.1"

[dependencies.webbrowser]
version = "1.2.2"

[dependencies.which]
version = "8"

[package.metadata.cargo-shear]
ignored-paths = [ "src/oauth/tests/persistor_tests.rs", "src/oauth/tests/credential_store_tests.rs", "src/oauth/tests/telemetry_tests.rs",]

[target."cfg(unix)".dependencies.libc]
version = "0.2.182"

[target."cfg(target_os = \"linux\")".dependencies.keyring]
version = "3.6"
default-features = false
features = [ "linux-native-async-persistent",]

[target."cfg(target_os = \"macos\")".dependencies.keyring]
version = "3.6"
default-features = false
features = [ "apple-native",]

[target."cfg(target_os = \"windows\")".dependencies.keyring]
version = "3.6"
default-features = false
features = [ "windows-native",]

[target."cfg(target_os = \"windows\")".dependencies.uuid]
version = "1"
features = [ "v4",]

[target."cfg(target_os = \"windows\")".dependencies.windows-sys]
version = "0.61.2"
features = [ "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",]

[target."cfg(any(target_os = \"freebsd\", target_os = \"openbsd\"))".dependencies.keyring]
version = "3.6"
default-features = false
features = [ "sync-secret-service",]
