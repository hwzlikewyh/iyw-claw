[package]
name = "aws-config"
version = "1.11.0"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"
autobins = false
autotests = false
autobenches = false
autoexamples = false

[lib]
name = "aws_config"
path = "src/lib.rs"
doctest = false

[dependencies."aws-credential-types"]
version = "^1.3.0"
features = ["test-util"]

[dependencies."aws-runtime"]
version = "^1.9.1"

[dependencies."aws-sdk-signin"]
version = "^1.20.0"
default-features = false
optional = true

[dependencies."aws-sdk-sso"]
version = "^1.107.0"
default-features = false
optional = true

[dependencies."aws-sdk-ssooidc"]
version = "^1.109.0"
default-features = false
optional = true

[dependencies."aws-sdk-sts"]
version = "^1.112.0"
default-features = false

[dependencies."aws-smithy-async"]
version = "^1.3.0"

[dependencies."aws-smithy-http"]
version = "^0.64.0"

[dependencies."aws-smithy-json"]
version = "^0.63.0"

[dependencies."aws-smithy-runtime"]
version = "^1.14.0"
features = ["client"]

[dependencies."aws-smithy-runtime-api"]
version = "^1.15.0"
features = ["client"]

[dependencies."aws-smithy-schema"]
version = "^0.2.0"

[dependencies."aws-smithy-types"]
version = "^1.6.2"

[dependencies."aws-types"]
version = "^1.5.0"

[dependencies."base64-simd"]
version = "^0.8.0"
optional = true

[dependencies."bytes"]
version = "^1.11.1"

[dependencies."fastrand"]
version = "^2.3.0"

[dependencies."hex"]
version = "^0.4.3"
optional = true

[dependencies."http"]
version = "^1"

[dependencies."p256"]
version = "^0.13.2"
optional = true

[dependencies."rand"]
version = "^0.8.5"
default-features = false
features = ["std","std_rng"]
optional = true

[dependencies."sha1"]
version = "^0.10"
optional = true

[dependencies."sha2"]
version = "^0.10.9"
optional = true

[dependencies."time"]
version = "^0.3.4"
features = ["parsing"]

[dependencies."tokio"]
version = "^1.13.1"
features = ["sync"]

[dependencies."tracing"]
version = "^0.1"

[dependencies."url"]
version = "^2.5.4"

[dependencies."uuid"]
version = "^1.18.1"
optional = true

[dependencies."zeroize"]
version = "^1"
optional = true

[features]
"allow-compilation" = []
"behavior-version-latest" = []
"client-hyper" = ["aws-smithy-runtime/default-https-client"]
"credentials-login" = ["dep:aws-sdk-signin","dep:sha2","dep:zeroize","dep:hex","dep:base64-simd","dep:uuid","uuid?/v4","dep:p256","p256?/arithmetic","p256?/pem","dep:rand"]
"credentials-process" = ["tokio/process"]
"default" = ["default-https-client","rt-tokio","credentials-process","sso"]
"default-https-client" = ["aws-smithy-runtime/default-https-client"]
"legacy-client" = ["aws-smithy-runtime/tls-rustls"]
"rt-tokio" = ["aws-smithy-async/rt-tokio","aws-smithy-runtime/rt-tokio","tokio/rt"]
"rustls" = ["client-hyper"]
"sso" = ["dep:aws-sdk-sso","dep:aws-sdk-ssooidc","dep:sha1","dep:hex","dep:zeroize","aws-smithy-runtime-api/http-auth"]
"test-util" = ["aws-runtime/test-util"]
