[package]
name = "iyw-codex-harness-upstream-probe"
version = "0.1.0"
description = "Explicit compile probe for the locked Codex in-process client"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
codex-app-server-client = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-app-server-client" }
codex-app-server-protocol = { git = "https://github.com/openai/codex.git", rev = "5adb68a49933ae446bf11935662c83dba55a0804", package = "codex-app-server-protocol" }
serde_json = "1"

# The Git dependency does not inherit codex-rs/Cargo.lock. These direct pins
# keep Rama's alpha releases aligned with the locked Codex workspace graph;
# without them Cargo may select the incompatible 0.3.0 stable crates.
rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"

# Git dependencies do not inherit the source workspace's root patches. Keep
# these pins synchronized with codex-rs/Cargo.toml at the locked commit.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92", version = "0.29.0" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
