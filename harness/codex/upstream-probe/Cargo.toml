[package]
name = "iyw-codex-harness-upstream-probe"
version = "0.1.0"
description = "Explicit compile probe for the locked Codex in-process client"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
codex-app-server-client = { git = "https://github.com/openai/codex.git", rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e", package = "codex-app-server-client" }
codex-app-server-protocol = { git = "https://github.com/openai/codex.git", rev = "ccf9be8cc458bd6b8336fe84d68d8893f2691a5e", package = "codex-app-server-protocol" }
serde_json = "1"

# The Git dependency does not inherit codex-rs/Cargo.lock. These direct pins
# keep Rama's alpha releases aligned with the locked Codex workspace graph;
# without them Cargo may select the incompatible 0.3.0 stable crates.
rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"

# Git dependencies do not inherit the source workspace's root patches. Keep
# these pins synchronized with codex-rs/Cargo.toml at the locked commit.
[patch.crates-io]
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "37ca4a27a9424ec5dbe6451f48c339d7b45f8d63", version = "0.29.0" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
