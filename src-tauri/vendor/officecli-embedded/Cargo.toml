[package]
name = "iyw-office-engine"
version = "0.1.32"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
canvas-core = { git = "https://github.com/RainLib/Foldly", rev = "1846fb35fcca4b5dcc49525089d1030578c3b8e0" }
office-engine = { git = "https://github.com/RainLib/Foldly", rev = "1846fb35fcca4b5dcc49525089d1030578c3b8e0" }
handler-common = { git = "https://github.com/RainLib/Foldly", rev = "1846fb35fcca4b5dcc49525089d1030578c3b8e0" }
oxml = { git = "https://github.com/RainLib/Foldly", rev = "1846fb35fcca4b5dcc49525089d1030578c3b8e0" }
docx-handler = { git = "https://github.com/RainLib/Foldly", rev = "1846fb35fcca4b5dcc49525089d1030578c3b8e0" }
xlsx-handler = { git = "https://github.com/RainLib/Foldly", rev = "1846fb35fcca4b5dcc49525089d1030578c3b8e0" }
pptx-handler = { git = "https://github.com/RainLib/Foldly", rev = "1846fb35fcca4b5dcc49525089d1030578c3b8e0" }
pdf-handler = { git = "https://github.com/RainLib/Foldly", rev = "1846fb35fcca4b5dcc49525089d1030578c3b8e0" }
hcd-core = { git = "https://github.com/RainLib/Foldly", rev = "1846fb35fcca4b5dcc49525089d1030578c3b8e0" }
hcd-formats = { git = "https://github.com/RainLib/Foldly", rev = "1846fb35fcca4b5dcc49525089d1030578c3b8e0" }
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
anyhow = { version = "1" }
colored = { version = "2" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
lopdf = { version = "0.34" }
tower-http = { version = "0.6", features = ["cors"] }
tracing = { version = "0.1" }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = { version = "2" }
futures = "0.3"
async-stream = "0.3"
office_oxide = "=0.1.17"
tempfile = { version = "3" }
unicode-normalization = "0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2" }
jsonwebtoken = "9.3"
sha2 = { version = "0.10" }
hmac = "0.12"
subtle = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
base64 = "0.22"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart", "stream"] }
object_store = { version = "0.12", features = ["aws"] }
tokio-postgres = "0.7"
