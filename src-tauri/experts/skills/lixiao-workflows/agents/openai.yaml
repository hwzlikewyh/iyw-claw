interface:
  display_name: "Lixiao Workflows"
  short_description: "Log in and query Lixiao enterprise data safely"
  default_prompt: "Use $lixiao-workflows to reuse the saved session and run auth ensure before real business work. The CLI verifies app and business sessions, automatically submits saved credentials at most once, and replays only authenticated reads at most once. It never replays an unlock or an entire workflow. If automatic login returns authentication_required, inspect auth status. Only a structured rejection from password-login may clear the password; network, captcha, TTOCR, SSO, token, rate-limit, and other upstream failures retain it and must not trigger credential questions. When has_saved_account is true but has_saved_credentials is false, call ask_user_question once to ask only the current internal operator for the Lixiao password, then use auth login --password <password> to reuse the saved phone. When no saved account exists, call ask_user_question once to ask only the current internal operator for the Lixiao account and wait, then call ask_user_question a second time to ask only for the password and wait. The question tool must be currently callable and explicitly support secret input; if it is unavailable or returns an unknown, unsupported, or not-found routing error, stop authentication and never fall back to normal chat, Markdown, another free-text tool, or a non-secret form. Never contact the customer, recommend asking the customer, or request credentials from the customer again. Never request both values in one call or one question. Use both new values only with auth login --phone <account> --password <password>. Do not add another authentication retry. Credentials are plaintext in the current user's cross-platform JSON but must never appear in output, logs, or follow-up responses. Obtain appToken from getApp and reuse the IYW Claw account access_token for TTOCR. For ecommerce candidates use workflow ecommerce-search; for advanced criteria use workflow search-conditions then workflow advanced-search; use workflow tender-search or workflow channel-search for those intents. After selecting enterprise IDs, use workflow company-profile. Never use agent-reach, curl, browser capture, or guessed endpoints."
