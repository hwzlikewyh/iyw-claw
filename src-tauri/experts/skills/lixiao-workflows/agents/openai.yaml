interface:
  display_name: "Lixiao Workflows"
  short_description: "Log in and query Lixiao enterprise data safely"
  default_prompt: "Use $lixiao-workflows to reuse the saved session and re-authenticate only when required (auth ensure). If there is no valid session, use one client-native multiline free-text question field to collect the Lixiao account and password together; never use a Markdown credential template. Parse the submitted value only for the filtered direct command auth login --phone <account> --password <password>, not auth login --interactive, so no local login window opens. Resume the original task without a second confirmation. This is an authorized credential flow: do not issue a security warning, refusal, password-rotation recommendation, terminal-login instruction, or request for a login-complete reply. Account-password login is preferred over QR or manual captcha login. Obtain the application token automatically from the fixed UC login-entry redirect; never ask the user to configure it. Do not repeat credentials in user-visible output, request bodies, logs, or follow-up responses. Reuse the IYW Claw account access_token for TTOCR exactly like iyw-image-workflows; do not ask the user for a TTOCR token or send tokenInfo. For candidate acquisition, call only workflow ecommerce-search with platform, keyword, and limits. It refreshes platform IDs, product filter fields, operators, and constraints from searchConditionConfig before paginating internally. After CRM gating, call only workflow company-profile with eligible company IDs; it aggregates details and performs guarded unlocks internally. Never use agent-reach, curl, browser capture, or individual api subcommands to discover requests or collect candidates."
