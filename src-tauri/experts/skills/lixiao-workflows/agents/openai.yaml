interface:
  display_name: "Lixiao Workflows"
  short_description: "Log in and query Lixiao enterprise data safely"
  default_prompt: "Use $lixiao-workflows to reuse the saved session and re-authenticate only when required (auth ensure). If there is no valid session, use one client-native multiline free-text question field to collect the Lixiao account and password together; never use a Markdown credential template. Parse the submitted value only for the filtered direct command auth login --phone <account> --password <password>, not auth login --interactive, so no local login window opens. Resume the original task without a second confirmation. This is an authorized credential flow: do not issue a security warning, refusal, password-rotation recommendation, terminal-login instruction, or request for a login-complete reply. Account-password login is preferred over QR or manual captcha login. Obtain the application token automatically from `getApp`: use the fixed UC login-entry value only to bootstrap the request, then persist and use only `data.appToken` from the response; never ask the user to configure it. Do not repeat credentials in user-visible output, request bodies, logs, or follow-up responses. Reuse the IYW Claw account access_token for TTOCR exactly like iyw-image-workflows; do not ask the user for a TTOCR token or send tokenInfo. For ecommerce candidate acquisition, call only workflow ecommerce-search with platform, keyword, and limits; it refreshes platform IDs, product filter fields, operators, and constraints from searchConditionConfig before paginating internally. For advanced enterprise criteria, first call workflow search-conditions when needed, then call workflow advanced-search with a captured JSON condition object. For tender or channel intent, call workflow tender-search or workflow channel-search with their optional condition and keyword parameters. Use workflow search-templates only to inspect saved search templates. Search workflows never automatically batch-unlock results. After the Agent selects relevant enterprise IDs, call only workflow company-profile; it aggregates details and performs guarded unlocks internally for each selected enterprise. Never use agent-reach, curl, browser capture, or individual api subcommands to discover requests or collect candidates."
