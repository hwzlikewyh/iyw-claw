interface:
  display_name: "IYW 图片工作流"
  short_description: "IYW 图片工具、商品套图、趋势知识与 Agent 工作流"
  default_prompt: "使用 $iyw-image-workflows 处理 IYW 产品、商品套图、素材、趋势、知识库、上传审查或商业图片任务；普通纯文生图、动漫和人物形象优先交给 $imagegen，只有用户明确要求 IYW 分身或多平台比稿时才用 fission-generate。先按场景手册选择工具和底部设置，再复用提示词模板，调用已确认的内部能力，验证结果后交付最终文件或 URL；不要向用户暴露接口、payload、内部 ID、provider 或 channel。"

policy:
  allow_implicit_invocation: true
