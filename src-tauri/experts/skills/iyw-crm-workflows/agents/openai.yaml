interface:
  display_name: "IYW CRM Workflows"
  short_description: "Log in and query IYW CRM customers safely"
  default_prompt: "Use $iyw-crm-workflows to reuse the saved CRM session. The CLI automatically submits saved credentials at most once when the session expires and replays a customer read at most once. Run auth ensure before the task. If it returns authentication_required, inspect auth status without exposing values. Only an explicit credential rejection from the password login page may clear the password; login-token, session-validation, network, rate-limit, and upstream failures retain it and must not trigger credential questions. When has_saved_account is true but has_saved_credentials is false, call ask_user_question once to ask only the current internal operator for the IYW CRM password, then use the filtered command auth login --password <password> to reuse the saved username. When the saved account is also absent, call ask_user_question once to ask only the current internal operator for the IYW CRM account and wait, then call ask_user_question a second time to ask only for the password and wait. Never contact the customer, recommend asking the customer, or request credentials from the customer again. Never request both values in one call or one question, and never use a normal chat reply or Markdown credential template. Use both new values only with auth login --username <username> --password <password>. Resume the original task without a second confirmation. Do not add another authentication retry. Credentials are stored as plaintext in the current user's cross-platform session JSON, but must never appear in output, logs, or follow-up responses. Direct HTTP access to the fixed http://crm.chdesign.com.cn origin is already authorized; do not ask for HTTP authorization or pass --allow-insecure-http for it."
