[package]
name = "iyw-share-target"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
iyw-share-core = { path = "../share-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["ApplicationModel", "ApplicationModel_Activation", "ApplicationModel_DataTransfer", "ApplicationModel_DataTransfer_ShareTarget", "Storage", "Storage_Streams", "Storage_Search", "Storage_FileProperties", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }

[profile.release]
strip = true
lto = "thin"

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "=0.3.5"
