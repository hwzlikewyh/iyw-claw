# Cargo 构建配置 - 链接器优化

# macOS - 使用系统默认链接器（ld64）
# 注意：macOS 不支持 lld，使用系统 ld64 已经很快
# 未来可以考虑 zld，但需要额外安装

# Linux x64 - 使用 lld 链接器加速
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Windows MSVC - 使用内置 lld 链接器
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
