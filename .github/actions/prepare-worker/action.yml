name: Prepare embedded Xinghe metadata
description: Validate the pinned in-process runtime identity without building separate workers
inputs:
  target:
    required: true
    description: Rust target triple
  dependency-cache:
    default: "false"
    description: Compatibility input; compiled dependencies belong to the application build
  setup-compiler-cache:
    default: "false"
    description: Compatibility input; compiler cache belongs to the application build
runs:
  using: composite
  steps:
    - name: Prepare embedded runtime identity
      shell: bash
      env:
        WORKER_TARGET: ${{ inputs.target }}
      run: |
        node src-tauri/scripts/prepare-xinghe-worker.mjs --target "$WORKER_TARGET"
        node src-tauri/scripts/verify-xinghe-worker-bundle.mjs --manifest-only --target "$WORKER_TARGET"
