name: Prepare cached Xinghe worker
description: Reuse compiled binaries and always reassemble and verify runtime resources
inputs:
  target:
    required: true
    description: Rust target triple
  dependency-cache:
    default: "false"
    description: Restore worker dependencies only when no compiled worker is available
  setup-compiler-cache:
    default: "false"
    description: Set up optional sccache only when compiled worker restoration misses
runs:
  using: composite
  steps:
    - id: identity
      shell: bash
      env:
        WORKER_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        key="$(node src-tauri/scripts/xinghe-worker-cache-key.mjs "$WORKER_TARGET")"
        echo "key=$key" >> "$GITHUB_OUTPUT"
    - name: Restore worker binary cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: harness/xinghe-worker/target/bundle-cache/${{ inputs.target }}
        key: ${{ steps.identity.outputs.key }}
    - name: Find worker artifact backup
      id: artifact
      uses: actions/github-script@v7
      env:
        WORKER_CACHE_KEY: ${{ steps.identity.outputs.key }}
        WORKER_ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const path = require("node:path");
          const findArtifact = require(path.join(process.env.WORKER_ACTION_PATH, "find-artifact.cjs"));
          await findArtifact({ github, context, core, key: process.env.WORKER_CACHE_KEY });
    - name: Download worker artifact backup
      id: download
      if: steps.cache.outputs.cache-hit != 'true' && steps.artifact.outputs.artifact-id != ''
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
        merge-multiple: true
        path: ${{ runner.temp }}/xinghe-worker-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        github-token: ${{ github.token }}
        run-id: ${{ steps.artifact.outputs.run-id }}
    - name: Restore worker file permissions
      if: steps.download.outcome == 'success'
      shell: bash
      env:
        WORKER_TARGET: ${{ inputs.target }}
        WORKER_ARCHIVE: ${{ runner.temp }}/xinghe-worker-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}/worker.tar
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          WORKER_ARCHIVE="$(cygpath -u "$WORKER_ARCHIVE")"
        fi
        directory="harness/xinghe-worker/target/bundle-cache/$WORKER_TARGET"
        mkdir -p "$directory"
        tar -xf "$WORKER_ARCHIVE" -C "$directory"
    - name: Setup optional compiler cache for cold builds
      if: inputs.setup-compiler-cache == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.download.outcome != 'success'
      uses: ./.github/actions/setup-sccache
    - name: Cache worker dependencies for cold builds
      if: inputs.dependency-cache == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.download.outcome != 'success'
      uses: swatinem/rust-cache@v2
      with:
        prefix-key: v1-worker-dependencies
        workspaces: harness/xinghe-worker -> target
        shared-key: worker-${{ inputs.target }}
        cache-bin: "false"
        cache-workspace-crates: "false"
        save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    - name: Prepare and verify worker resources
      shell: bash
      env:
        WORKER_TARGET: ${{ inputs.target }}
      run: node src-tauri/scripts/prepare-xinghe-worker.mjs --target "$WORKER_TARGET"
    - name: Save worker binary cache
      uses: actions/cache/save@v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: harness/xinghe-worker/target/bundle-cache/${{ inputs.target }}
        key: ${{ steps.identity.outputs.key }}
    - name: Archive verified worker binaries
      if: steps.artifact.outputs.artifact-id == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      shell: bash
      env:
        WORKER_TARGET: ${{ inputs.target }}
        WORKER_ARCHIVE: ${{ runner.temp }}/xinghe-worker-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}/worker.tar
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          WORKER_ARCHIVE="$(cygpath -u "$WORKER_ARCHIVE")"
        fi
        mkdir -p "$(dirname "$WORKER_ARCHIVE")"
        tar -cf "$WORKER_ARCHIVE" -C "harness/xinghe-worker/target/bundle-cache/$WORKER_TARGET" .
    - name: Save worker artifact backup
      if: steps.artifact.outputs.artifact-id == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.identity.outputs.key }}
        path: ${{ runner.temp }}/xinghe-worker-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}/worker.tar
        if-no-files-found: error
        retention-days: 14
