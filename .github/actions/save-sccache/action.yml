name: Report and save compiler objects
description: Report cache health and save local compiler objects in one batch
runs:
  using: composite
  steps:
    - name: Report compiler cache health
      id: stats
      if: env.RUSTC_WRAPPER == 'sccache'
      continue-on-error: true
      shell: bash
      env:
        SCCACHE_ACTION_PATH: ${{ github.action_path }}
      run: node "$SCCACHE_ACTION_PATH/report.mjs"
    - name: Save compiler objects
      if: ${{ !cancelled() && steps.stats.outputs.save == 'true' }}
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ env.IYW_SCCACHE_CACHE_KEY }}
