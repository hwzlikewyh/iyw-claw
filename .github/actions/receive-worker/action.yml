name: Receive independently compiled worker
description: Wait for this source and target, then verify and stage compiled worker resources
inputs:
  target:
    required: true
    description: Rust target triple
  check-only:
    default: "false"
    description: Fail early if the producer ended without an artifact, without waiting or downloading
runs:
  using: composite
  steps:
    - name: Identify worker artifact
      id: identity
      shell: bash
      env:
        WORKER_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        echo "name=release-worker-$WORKER_TARGET-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Wait for worker producer
      id: artifact
      uses: actions/github-script@v7
      env:
        WORKER_ARTIFACT_NAME: ${{ steps.identity.outputs.name }}
        WORKER_TARGET: ${{ inputs.target }}
        WORKER_ACTION_PATH: ${{ github.action_path }}
        WORKER_CHECK_ONLY: ${{ inputs.check-only }}
      with:
        script: |
          const path = require("node:path");
          const wait = require(path.join(process.env.WORKER_ACTION_PATH, "wait-artifact.cjs"));
          await wait({ github, context, core, name: process.env.WORKER_ARTIFACT_NAME, target: process.env.WORKER_TARGET, checkOnly: process.env.WORKER_CHECK_ONLY === "true" });
    - name: Download worker for this release
      if: inputs.check-only != 'true'
      uses: actions/download-artifact@v4
      with:
        artifact-ids: ${{ steps.artifact.outputs.id }}
        merge-multiple: true
        path: ${{ runner.temp }}/release-worker-${{ inputs.target }}
        github-token: ${{ github.token }}
        run-id: ${{ github.run_id }}
    - name: Restore and verify compiled worker
      if: inputs.check-only != 'true'
      shell: bash
      env:
        WORKER_TARGET: ${{ inputs.target }}
        WORKER_ARCHIVE: ${{ runner.temp }}/release-worker-${{ inputs.target }}/worker.tar
        IYW_XINGHE_WORKER_REQUIRE_CACHE: "1"
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          WORKER_ARCHIVE="$(cygpath -u "$WORKER_ARCHIVE")"
        fi
        directory="harness/xinghe-worker/target/bundle-cache/$WORKER_TARGET"
        mkdir -p "$directory"
        tar -xf "$WORKER_ARCHIVE" -C "$directory"
        node src-tauri/scripts/prepare-xinghe-worker.mjs --target "$WORKER_TARGET"
