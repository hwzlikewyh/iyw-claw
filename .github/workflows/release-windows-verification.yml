name: Verify Signed Windows Installers

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      artifact_run_id:
        required: false
        type: string
      verify_environment:
        description: Requires environment bindings for this published PC version
        required: false
        type: boolean
        default: true
      verify_branding:
        required: false
        type: boolean
        default: false

jobs:
  verify:
    name: Verify installed ${{ matrix.target }}
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download signed installer and staged resources
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-verification-${{ matrix.target }}
          path: src-tauri
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}

      - name: Checkout current installation verification tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .verification-tools
          sparse-checkout: src-tauri/scripts/nsis-smoke-windows.mjs
          sparse-checkout-cone-mode: false
      - name: Apply synchronous smoke uninstaller cleanup
        shell: pwsh
        run: Copy-Item -LiteralPath .verification-tools/src-tauri/scripts/nsis-smoke-windows.mjs -Destination src-tauri/scripts/nsis-smoke-windows.mjs -Force
      - name: Verify installed NSIS sidecars
        env:
          IYW_CLAW_VERIFY_NSIS: "1"
          IYW_CLAW_SIGN_MODE: signtool
        run: node src-tauri/scripts/verify-sidecar-bundle.mjs --target "${{ matrix.target }}"

      - name: Verify real NSIS environment installation
        if: inputs.verify_environment
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Requires a disposable hosted runner' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $root = Join-Path ([Environment]::GetFolderPath('UserProfile')) '.iyw-claw'
          if (Test-Path -LiteralPath $root) { throw 'Refusing to modify an existing user environment' }
          $installers = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter "*_$($version)_x64-setup.exe")
          if ($installers.Count -ne 1) { throw 'Expected exactly one signed installer' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'iyw-environment-live-install'
          if (Test-Path -LiteralPath $installRoot) { throw 'Live installation root already exists' }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S',"/D=$installRoot") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            Get-Content (Join-Path $root 'logs/environment/last-error.log') -ErrorAction SilentlyContinue
            throw "Real NSIS installation failed: $($process.ExitCode)"
          }
          $helper = Join-Path $installRoot 'app/iyw-environment.exe'
          & $helper diagnose --json
          if ($LASTEXITCODE -ne 0) { throw 'Installed environment integrity check failed' }
          $snapshot = Get-Content (Join-Path $root 'inventory/environment-current.json') -Raw | ConvertFrom-Json
          if ($snapshot.pcVersion -ne $version) { throw 'Environment version mismatch' }
          foreach ($component in @('node','git','uv')) {
            if ($component -notin $snapshot.components.componentId) { throw "Missing required component: $component" }
          }
      - name: Verify two brands use identical signed PC bytes
        if: inputs.verify_branding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/direct' -Filter '*-app-payload.zip')
          if ($payload.Count -ne 1) { throw 'Expected one common PC payload' }
          $identities = @()
          $digests = @()
          foreach ($brand in @('iyw', 'yun')) {
            $root = Join-Path $env:RUNNER_TEMP "installed-brand-$brand-$env:GITHUB_RUN_ID"
            if (Test-Path -LiteralPath $root) { throw 'Verification destination already exists' }
            Expand-Archive -LiteralPath $payload[0].FullName -DestinationPath $root
            New-Item -ItemType Directory -Path "$root/config" | Out-Null
            $name = if ($brand -eq 'iyw') { '原助理' } else { '云助理' }
            Copy-Item src-tauri/icons/128x128.png "$root/config/logo.png"
            @{brandId=$brand;displayName=$name;logoFile='logo.png'} | ConvertTo-Json | Set-Content "$root/config/branding.json" -Encoding utf8
            $executable = Join-Path $root 'app/iyw-claw.exe'
            $digests += (Get-FileHash -LiteralPath $executable).Hash
            $start = [Diagnostics.ProcessStartInfo]::new($executable, '--installation-brand')
            $start.UseShellExecute=$false; $start.CreateNoWindow=$true; $start.RedirectStandardOutput=$true
            $process=[Diagnostics.Process]::Start($start)
            try {
              if (-not $process.WaitForExit(20000)) { $process.Kill(); throw 'Brand startup verification timed out' }
              if ($process.ExitCode -ne 0) { throw 'Signed PC failed to start' }
              $identity = $process.StandardOutput.ReadToEnd() | ConvertFrom-Json
            } finally { $process.Dispose() }
            if ($identity.capability -ne 'IYW_INSTALLED_BRAND_V1' -or $identity.productKey -ne 'iyw-claw' -or $identity.brandId -ne $brand -or $identity.displayName -ne $name -or !$identity.hasLogo) { throw 'Installed brand mismatch' }
            $identities += $identity
          }
          if ($digests[0] -ne $digests[1]) { throw 'Brands must use identical PC bytes' }
          if ($identities[0].identifier -eq $identities[1].identifier -or $identities[0].userDirectory -eq $identities[1].userDirectory) { throw 'Brand namespaces must differ' }
