name: Release Server Bundles

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_ref:
        required: false
        type: string
        default: ""
      frontend_artifact:
        required: false
        type: string
        default: release-frontend-out

env:
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  build:
    name: Server ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux x64"
            runner: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            artifact: "iyw-claw-server-linux-x64"
          - name: "Linux arm64"
            runner: "ubuntu-22.04"
            target: "aarch64-unknown-linux-gnu"
            artifact: "iyw-claw-server-linux-arm64"
          - name: "Windows x64"
            runner: "windows-2022"
            target: "x86_64-pc-windows-msvc"
            artifact: "iyw-claw-server-windows-x64"
          - name: "Windows 32-bit"
            runner: "windows-2022"
            target: "i686-pc-windows-msvc"
            artifact: "iyw-claw-server-windows-x86"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag }}

      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-workflow
          sparse-checkout: .github/scripts/release
          sparse-checkout-cone-mode: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: server-${{ matrix.target }}

      - name: Install Linux arm64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: bash .release-workflow/.github/scripts/release/setup-linux-arm64.sh server

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.frontend_artifact }}
          path: out

      - name: Build server
        working-directory: src-tauri
        shell: bash
        run: |
          cargo build \
            --release \
            --bin iyw-claw-server \
            --no-default-features \
            --features server-runtime \
            --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package="dist/${{ matrix.artifact }}"
          mkdir -p "$package"
          cp "src-tauri/target/${{ matrix.target }}/release/iyw-claw-server" "$package/"
          chmod +x "$package/iyw-claw-server"
          cp -r out "$package/web"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $package
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/iyw-claw-server.exe" "$package/"
          Copy-Item -Recurse out "$package/web"
          Compress-Archive -Path $package -DestinationPath "$package.zip"

      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "dist/${{ matrix.artifact }}"
          $server = "dist/${{ matrix.artifact }}/iyw-claw-server.exe"
          $webIndex = "$package/web/index.html"
          if (-not (Test-Path $server -PathType Leaf)) {
            throw "iyw-claw-server.exe missing from packaged artifact"
          }
          if ((Get-Item -LiteralPath $server).Length -le 0) {
            throw "iyw-claw-server.exe is empty in packaged artifact"
          }
          if (-not (Test-Path $webIndex -PathType Leaf)) {
            throw "web/index.html missing from packaged artifact"
          }
          if ((Get-Item -LiteralPath $webIndex).Length -le 0) {
            throw "web/index.html is empty in packaged artifact"
          }
          $allowed = @("iyw-claw-server.exe", "web")
          $unexpected = @(Get-ChildItem -LiteralPath $package -Force | Where-Object {
            $_.Name -notin $allowed
          })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected top-level package entries: $($unexpected.Name -join ', ')"
          }
          $legacy = @(Get-ChildItem -LiteralPath $package -Recurse -Force | Where-Object {
            $_.Name -like "iyw-claw-mcp*"
          })
          if ($legacy.Count -gt 0) {
            throw "Legacy MCP content found in packaged artifact: $($legacy.FullName -join ', ')"
          }

      - name: Smoke test Unix package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package="dist/${{ matrix.artifact }}"
          server="dist/${{ matrix.artifact }}/iyw-claw-server"
          if [ ! -x "$server" ]; then
            echo "::error::iyw-claw-server missing or not executable in packaged artifact"
            exit 1
          fi
          if [ ! -s "$server" ]; then
            echo "::error::iyw-claw-server missing or empty in packaged artifact"
            exit 1
          fi
          if [ ! -s "$package/web/index.html" ]; then
            echo "::error::web/index.html missing or empty in packaged artifact"
            exit 1
          fi
          unexpected="$(find "$package" -mindepth 1 -maxdepth 1 \
            ! -name iyw-claw-server ! -name web -print)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected top-level package entries: $unexpected"
            exit 1
          fi
          legacy="$(find "$package" -iname 'iyw-claw-mcp*' -print)"
          if [ -n "$legacy" ]; then
            echo "::error::Legacy MCP content found in packaged artifact: $legacy"
            exit 1
          fi

      - name: Sign and checksum Unix archive
        if: runner.os != 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/${{ matrix.artifact }}.tar.gz"
          pnpm dlx @tauri-apps/cli@2.11.4 signer sign "$archive"
          if [ ! -s "$archive.sig" ]; then
            echo "::error::Signature missing or empty for $archive"
            exit 1
          fi
          (
            cd dist
            shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          )

      - name: Sign and checksum Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $archive = "dist/${{ matrix.artifact }}.zip"
          pnpm dlx @tauri-apps/cli@2.11.4 signer sign $archive
          $signature = "$archive.sig"
          if (-not (Test-Path $signature -PathType Leaf)) {
            throw "signature not produced for $archive"
          }
          if ((Get-Item -LiteralPath $signature).Length -le 0) {
            throw "signature is empty for $archive"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "$archive.sha256"

      - name: Upload Unix release assets
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          assets=(
            "dist/${{ matrix.artifact }}.tar.gz"
            "dist/${{ matrix.artifact }}.tar.gz.sig"
            "dist/${{ matrix.artifact }}.tar.gz.sha256"
          )
          for attempt in 1 2 3; do
            if gh release upload "${{ inputs.release_tag }}" "${assets[@]}" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Release asset upload failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::Release asset upload attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done

      - name: Upload Windows release assets
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $assets = @(
            "dist/${{ matrix.artifact }}.zip"
            "dist/${{ matrix.artifact }}.zip.sig"
            "dist/${{ matrix.artifact }}.zip.sha256"
          )
          foreach ($attempt in 1..3) {
            gh release upload "${{ inputs.release_tag }}" @assets --clobber
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq 3) {
              throw "Release asset upload failed after $attempt attempts"
            }
            Write-Warning "Release asset upload attempt $attempt failed; retrying"
            Start-Sleep -Seconds ($attempt * 10)
          }
