name: Transfer Release Staging
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      tag:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: staging
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Upload temporary staging asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test -s staging/iyw-windows-staging.zip
          sha256sum staging/iyw-windows-staging.zip
          gh release upload "$RELEASE_TAG" staging/iyw-windows-staging.zip
