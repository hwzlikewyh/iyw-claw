name: Transfer Release Staging
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      tag:
        required: true
        type: string
      archive_name:
        description: ZIP filename for raw signing input
        required: false
        default: iyw-windows-staging.zip
        type: string
permissions:
  contents: write
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: staging
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Upload temporary staging asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARCHIVE_NAME: ${{ inputs.archive_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          [[ "$ARCHIVE_NAME" =~ ^iyw-windows(-x86)?-staging\.zip$ ]]
          if [[ ! -f "staging/$ARCHIVE_NAME" ]]; then
            (cd staging && zip -q -1 -r "../$ARCHIVE_NAME" .)
            mv "$ARCHIVE_NAME" "staging/$ARCHIVE_NAME"
          fi
          test -s "staging/$ARCHIVE_NAME"
          sha256sum "staging/$ARCHIVE_NAME"
          gh release upload "$RELEASE_TAG" "staging/$ARCHIVE_NAME"
