name: Verify Final Desktop Release
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      release_id:
        required: true
        type: string
      verification_run_id:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  verify-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: .github/scripts/release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-verification-x86_64-pc-windows-msvc
          path: src-tauri
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
      - name: Verify signed embedded runtime against build input
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SIGNER: ${{ vars.WINDOWS_SIGN_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/iyw-claw_$env:RELEASE_VERSION`_x64-setup.exe"
          $extracted = Join-Path $env:RUNNER_TEMP 'signed-x64-resources'
          & 7z x $installer "-o$extracted" 'iyw-claw.exe' 'xinghe-resources/*'
          if ($LASTEXITCODE -ne 0) { throw 'Installer resource extraction failed' }
          ./.release-tools/.github/scripts/release/verify-signed-pe.ps1 -ExpectedRoot src-tauri/target/x86_64-pc-windows-msvc/release -SignedRoot $extracted -Thumbprint $env:SIGNER
          $expected = (Get-FileHash src-tauri/resources/xinghe-worker/runtime.json).Hash
          $installed = (Get-FileHash (Join-Path $extracted 'xinghe-resources/runtime.json')).Hash
          if ($expected -ne $installed) { throw 'Embedded runtime metadata changed in the installer' }
          node --input-type=module -e "import {verifyWorkerBundle} from './src-tauri/scripts/verify-xinghe-worker-bundle.mjs'; console.log(verifyWorkerBundle(process.argv[1], 'x86_64-pc-windows-msvc'))" $extracted
          if ($LASTEXITCODE -ne 0) { throw 'Embedded runtime verification failed' }
      - name: Verify actual x64 installation
        env:
          IYW_CLAW_VERIFY_NSIS: "1"
          IYW_CLAW_SIGN_MODE: signtool
        run: node src-tauri/scripts/verify-sidecar-bundle.mjs --target x86_64-pc-windows-msvc
  publish:
    needs: verify-x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          VERSION: ${{ inputs.version }}
          VERIFICATION_RUN: ${{ inputs.verification_run_id }}
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const runId = Number(process.env.VERIFICATION_RUN);
            const source = (await github.rest.repos.getCommit({...context.repo,ref:process.env.SOURCE_REF})).data.sha;
            const run = (await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId})).data;
            const tag = `v${process.env.VERSION}`;
            const tagged = (await github.rest.repos.getCommit({...context.repo,ref:tag})).data.sha;
            if(run.head_sha !== source || tagged !== source) throw new Error('Release source does not match the verified build');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:runId,per_page:100});
            const required = [
              'build-tauri / Build Linux x64',
              'build-tauri / Build macOS arm64',
              'build-macos-x64 / Build macOS x64',
              'build-windows (x86_64-pc-windows-msvc) / build',
              'build-windows (x86_64-pc-windows-msvc) / sign',
              'verify-windows-installers / Verify installed x86_64-pc-windows-msvc',
              'verify-macos-x64-installer / verify',
            ];
            for(const name of required) {
              if(jobs.find(job=>job.name===name)?.conclusion!=='success') throw new Error(`${name} has not passed`);
            }
            const releaseId=Number(process.env.RELEASE_ID);
            const release=(await github.rest.repos.getRelease({...context.repo,release_id:releaseId})).data;
            if(!release.draft || release.tag_name!==tag) throw new Error('Release is not ready');
            const {cleanupStaging}=await import(`${process.cwd()}/.github/scripts/release/github-assets.mjs`);
            await cleanupStaging({repo:`${context.repo.owner}/${context.repo.repo}`,releaseId,tag});
            const updater=require('./.github/scripts/release/upload-updater-json.cjs');
            const notes=release.body || '';
            await updater({github,context,core,tag,releaseId,notes});
            await updater.assertPublishableReleaseAssets({github,context,core,releaseId});
            await github.rest.repos.updateRelease({...context.repo,release_id:releaseId,draft:false,prerelease:false,body:notes});
