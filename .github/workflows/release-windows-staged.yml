name: Build and Sign Windows Release
on:
  workflow_call:
    inputs:
      parallel_worker:
        default: false
        type: boolean
      target:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      release_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      frontend_artifact:
        required: false
        default: release-frontend-out
        type: string
env:
  TAURI_TARGET_TRIPLE: ${{ inputs.target }}
  SOURCE_REF: ${{ inputs.source_ref }}
  RELEASE_ID: ${{ inputs.release_id }}
  RELEASE_TAG: ${{ inputs.release_tag }}
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: write
      actions: read
    outputs:
      asset_id: ${{ steps.upload.outputs.asset_id }}
      sha256: ${{ steps.upload.outputs.sha256 }}
    env:
      CARGO_HOME: 'C:\c'
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
      CARGO_PROFILE_RELEASE_LTO: "off"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Initialize build paths
        run: |
          git config --global core.longpaths true
          "IYW_CLAW_STAGING_DIR=$env:RUNNER_TEMP/staging-$env:TAURI_TARGET_TRIPLE" >> $env:GITHUB_ENV
          "STAGING_ARCHIVE=$env:RUNNER_TEMP/iyw-staging-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:TAURI_TARGET_TRIPLE.zip" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            .github/scripts/release
            src-tauri/scripts
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !contains(inputs.target, '-win7-') }}
        with:
          targets: ${{ inputs.target }}
      - uses: dtolnay/rust-toolchain@master
        if: contains(inputs.target, '-win7-')
        with:
          toolchain: nightly-2026-04-15
          components: rust-src
      - uses: ./.github/actions/setup-sccache
      # checkout 会刷新文件修改时间，Cargo 因此整体重编 codex 补丁；固定后按内容哈希区分缓存。
      - name: Pin path dependency mtimes
        id: pathdeps
        run: node .release-tools/.github/scripts/release/pin-path-dep-mtimes.mjs harness/codex
      - uses: swatinem/rust-cache@v2
        with:
          # Worker binaries have their own cache and artifact backup.
          prefix-key: v1-desktop-app
          workspaces: src-tauri -> target
          shared-key: desktop-${{ inputs.target }}-${{ steps.pathdeps.outputs.hash }}
          cache-bin: "false"
          cache-workspace-crates: "false"
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b
        if: startsWith(inputs.target, 'i686-')
        with:
          version: 2.16.03
          platform: win64
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare archived Win7 WebView2 Runtime
        if: contains(inputs.target, '-win7-')
        env:
          WEBVIEW2_CAB_URL: ${{ secrets[startsWith(inputs.target, 'i686-') && 'WIN7_WEBVIEW2_X86_CAB_URL' || 'WIN7_WEBVIEW2_X64_CAB_URL'] }}
          WEBVIEW2_CAB_SHA256: ${{ secrets[startsWith(inputs.target, 'i686-') && 'WIN7_WEBVIEW2_X86_CAB_SHA256' || 'WIN7_WEBVIEW2_X64_CAB_SHA256'] }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBVIEW2_CAB_URL)) { throw 'Win7 release requires the matching WebView2 Runtime 109 CAB URL secret' }
          if ($env:WEBVIEW2_CAB_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Win7 release requires the matching WebView2 Runtime 109 CAB SHA-256 secret' }
          $url = [Uri]$env:WEBVIEW2_CAB_URL
          if ($url.Scheme -ne 'https' -or $url.UserInfo) { throw 'CAB URL must use HTTPS without embedded credentials' }
          $cab = Join-Path $env:RUNNER_TEMP 'webview2-109.cab'
          Invoke-WebRequest -Uri $url -OutFile $cab
          if ((Get-FileHash -LiteralPath $cab -Algorithm SHA256).Hash -ne $env:WEBVIEW2_CAB_SHA256) { throw 'WebView2 CAB integrity check failed' }
          $runtime = Join-Path $env:RUNNER_TEMP 'webview2-109'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          expand.exe $cab '-F:*' $runtime
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 CAB extraction failed' }
          $executables = @(Get-ChildItem -LiteralPath $runtime -Recurse -File -Filter msedgewebview2.exe)
          if ($executables.Count -ne 1) { throw 'Expected one WebView2 Runtime executable' }
          "IYW_WIN7_WEBVIEW2_FIXED_RUNTIME_PATH=$($executables[0].DirectoryName)" >> $env:GITHUB_ENV
      - name: Configure Win7 release toolchain
        if: contains(inputs.target, '-win7-')
        run: |
          "RUSTUP_TOOLCHAIN=nightly-2026-04-15" >> $env:GITHUB_ENV
          "CARGO_UNSTABLE_BUILD_STD=std,panic_abort" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.frontend_artifact }}
          path: out
      - name: Stage sidecars
        run: pnpm tauri:prepare-sidecars --target $env:TAURI_TARGET_TRIPLE
      - name: Stage verified WebView2 Runtime
        if: contains(inputs.target, '-win7-')
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'tauri-win7-build.json'
          node src-tauri/scripts/prepare-win7-webview.mjs --config $config
          if ($LASTEXITCODE -ne 0) { throw 'Win7 WebView2 configuration failed' }
          "IYW_WIN7_BUILD_CONFIG=$config" >> $env:GITHUB_ENV
      - name: Compile application alongside worker
        if: inputs.parallel_worker && !contains(inputs.target, '-win7-')
        env:
          IYW_CLAW_SKIP_SIDECAR: "1"
        run: |
          pnpm exec tauri build --target $env:TAURI_TARGET_TRIPLE --features tauri-runtime --config src-tauri/tauri.ci.conf.json --config src-tauri/tauri.compile-only.conf.json --no-bundle --no-sign -- --timings
          if ($LASTEXITCODE -ne 0) { throw 'Parallel Windows compilation failed' }
      - name: Receive independently compiled worker
        if: inputs.parallel_worker && !contains(inputs.target, '-win7-')
        uses: ./.github/actions/receive-worker
        with:
          target: ${{ inputs.target }}
      - uses: ./.github/actions/prepare-worker
        if: ${{ (!inputs.parallel_worker || contains(inputs.target, '-win7-')) && hashFiles('.github/actions/prepare-worker/action.yml') != '' }}
        with:
          target: ${{ inputs.target }}
      - name: Prepare legacy worker
        if: ${{ (!inputs.parallel_worker || contains(inputs.target, '-win7-')) && hashFiles('.github/actions/prepare-worker/action.yml') == '' }}
        run: pnpm tauri:prepare-xinghe-worker --target $env:TAURI_TARGET_TRIPLE
      - name: Compile unsigned application only
        if: ${{ !inputs.parallel_worker || contains(inputs.target, '-win7-') }}
        env:
          IYW_CLAW_SKIP_SIDECAR: "1"
        run: |
          $win7Config = @()
          if ($env:TAURI_TARGET_TRIPLE -like '*-win7-*') { $win7Config = @('--config', $env:IYW_WIN7_BUILD_CONFIG) }
          pnpm exec tauri build --target $env:TAURI_TARGET_TRIPLE --features tauri-runtime --config src-tauri/tauri.ci.conf.json @win7Config --no-bundle --no-sign -- --timings
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed' }
      - name: Package verified signing input
        run: |
          node .release-tools/.github/scripts/release/windows-release.mjs prepare
          if ($LASTEXITCODE -ne 0) { throw 'Staging manifest failed' }
          Compress-Archive -Path (Join-Path $env:IYW_CLAW_STAGING_DIR '*') -DestinationPath $env:STAGING_ARCHIVE -CompressionLevel Fastest
      - id: upload
        name: Transfer staging through draft release
        run: node .release-tools/.github/scripts/release/windows-release.mjs upload
      - uses: ./.github/actions/build-timings
        if: always() && !inputs.parallel_worker && hashFiles('.github/actions/build-timings/action.yml') != ''
        with:
          target: ${{ inputs.target }}

  sign:
    needs: build
    runs-on: [self-hosted, Windows, X64, iyw-signing]
    concurrency:
      group: windows-signing-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_ASSET_ID: ${{ needs.build.outputs.asset_id }}
      STAGING_SHA256: ${{ needs.build.outputs.sha256 }}
      IYW_CLAW_SIGN_MODE: signtool
      IYW_CLAW_SIGN_REQUIRED: "1"
      IYW_CLAW_SIGN_THUMBPRINT: ${{ vars.WINDOWS_SIGN_THUMBPRINT }}
      # The SafeNet token needs its user PIN for every signing session. Supplying
      # it here lets the finalizer unlock the token through PKCS#11 instead of
      # blocking on the interactive "Token Logon" dialog. Leave the secret unset
      # to fall back to a manual login.
      IYW_CLAW_SAFENET_PIN: ${{ secrets.IYW_CLAW_SAFENET_PIN }}
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      # GitHub checkout and asset hosts require the runner's existing proxy.
      NO_PROXY: localhost,127.0.0.1,api.github.com,uploads.github.com
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: http.version
      GIT_CONFIG_VALUE_0: HTTP/1.1
      GIT_TERMINAL_PROMPT: "0"
      IYW_CLAW_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
      TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
      IYW_CLAW_SKIP_SIDECAR: "1"
    steps:
      - name: Initialize signing paths
        run: |
          if ([string]::IsNullOrWhiteSpace($env:IYW_CLAW_SAFENET_PIN)) { throw 'Signing requires IYW_CLAW_SAFENET_PIN; interactive login is disabled in CI' }
          if (($env:IYW_CLAW_SIGN_THUMBPRINT -replace '[\s:]', '') -notmatch '^[a-fA-F0-9]{40}$') { throw 'Signing requires a valid WINDOWS_SIGN_THUMBPRINT' }
          "IYW_CLAW_STAGING_DIR=$env:RUNNER_TEMP/sign-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:TAURI_TARGET_TRIPLE" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            .github/scripts/release
            src-tauri/scripts
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !contains(inputs.target, '-win7-') }}
        with:
          targets: ${{ inputs.target }}
      - uses: dtolnay/rust-toolchain@master
        if: contains(inputs.target, '-win7-')
        with:
          toolchain: nightly-2026-04-15
          components: rust-src
      - name: Configure Win7 signing toolchain
        if: contains(inputs.target, '-win7-')
        run: |
          "RUSTUP_TOOLCHAIN=nightly-2026-04-15" >> $env:GITHUB_ENV
          "CARGO_UNSTABLE_BUILD_STD=std,panic_abort" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare local bundler
        run: pnpm install --frozen-lockfile --prefer-offline
      - id: download
        name: Download or reuse verified staging
        timeout-minutes: 16
        run: node .release-tools/.github/scripts/release/windows-release.mjs download
      - name: Extract signing input
        env:
          ARCHIVE: ${{ steps.download.outputs.archive }}
        run: Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath $env:IYW_CLAW_STAGING_DIR
      - name: Sign, bundle, verify and upload
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node .release-tools/.github/scripts/release/windows-release.mjs finalize
      - name: Upload signed installation verification input
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-verification-${{ inputs.target }}
          overwrite: true
          path: |
            src-tauri/target/${{ inputs.target }}/release/iyw-claw.exe
            src-tauri/target/${{ inputs.target }}/release/bundle/nsis/*_${{ env.RELEASE_VERSION }}_${{ startsWith(inputs.target, 'i686-') && 'x86' || 'x64' }}-setup.exe
            src-tauri/resources/xinghe-worker/*
            src-tauri/binaries/iyw-environment-${{ inputs.target }}.exe
          compression-level: 1
          if-no-files-found: error
          retention-days: 2
