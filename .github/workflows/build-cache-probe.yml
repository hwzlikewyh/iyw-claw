name: Build Cache Probe

# 临时验证：固定 path 依赖的修改时间后，缓存能否避免 codex 补丁连锁重编。
# 编译步骤、环境变量与正式发布一致；只编译，不打包、不签名、不发布。
# 只在推送 ci/cache-probe 分支时运行，缓存也只属于该分支。
on:
  push:
    branches: [ci/cache-probe]

permissions:
  contents: read
  actions: read

env:
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/frontend-cache
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: cache-probe-frontend-out
          path: out
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  macos:
    needs: frontend
    name: Compile ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
      CARGO_PROFILE_RELEASE_LTO: "off"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/setup-sccache
      - id: pathdeps
        name: Pin path dependency mtimes
        run: node .github/scripts/release/pin-path-dep-mtimes.mjs harness/codex
      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: v1-desktop-app
          workspaces: ./src-tauri -> target
          shared-key: desktop-${{ matrix.target }}-${{ steps.pathdeps.outputs.hash }}
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-on-failure: "true"
      - uses: actions/download-artifact@v4
        with:
          name: cache-probe-frontend-out
          path: out
      - name: Stage desktop sidecars
        run: pnpm tauri:prepare-sidecars --target ${{ matrix.target }}
      - name: Verify staged sidecars
        run: node src-tauri/scripts/verify-sidecar-bundle.mjs --target "${{ matrix.target }}"
      - name: Compile application
        timeout-minutes: 130
        env:
          BUILD_TARGET: ${{ matrix.target }}
          IYW_CLAW_SKIP_SIDECAR: "1"
          TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
        run: bash .github/scripts/release/compile-desktop.sh "$BUILD_TARGET"
      - if: always()
        uses: ./.github/actions/build-timings
        with:
          target: ${{ matrix.target }}
      - if: always()
        continue-on-error: true
        run: sccache --show-stats

  windows:
    needs: frontend
    name: Compile x86_64-pc-windows-msvc
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
      CARGO_HOME: 'C:\c'
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
      CARGO_PROFILE_RELEASE_LTO: "off"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-sccache
      - id: pathdeps
        name: Pin path dependency mtimes
        run: node .github/scripts/release/pin-path-dep-mtimes.mjs harness/codex
      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: v1-desktop-app
          workspaces: src-tauri -> target
          shared-key: desktop-x86_64-pc-windows-msvc-${{ steps.pathdeps.outputs.hash }}
          cache-bin: "false"
          cache-workspace-crates: "false"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: cache-probe-frontend-out
          path: out
      - name: Stage sidecars
        run: pnpm tauri:prepare-sidecars --target $env:TAURI_TARGET_TRIPLE
      - name: Compile application
        timeout-minutes: 130
        env:
          IYW_CLAW_SKIP_SIDECAR: "1"
        run: |
          pnpm exec tauri build --target $env:TAURI_TARGET_TRIPLE --features tauri-runtime --config src-tauri/tauri.ci.conf.json --config src-tauri/tauri.compile-only.conf.json --no-bundle --no-sign -- --timings
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed' }
      - if: always()
        uses: ./.github/actions/build-timings
        with:
          target: x86_64-pc-windows-msvc
      - if: always()
        continue-on-error: true
        run: sccache --show-stats
