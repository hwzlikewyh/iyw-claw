name: Warm Desktop Build Cache

# 依赖变化后在 main 提前执行真实 Release 编译，缓存可供后续发布复用。
# 复用正式发布的 target、features、profile 和精确补丁身份；只编译。
on:
  workflow_dispatch:
  push:
    branches: [main, ci/cache-probe]
    paths:
      - harness/codex/**
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/vendor/**
      - src-tauri/environment-core/**
      - .cargo/**
      - .github/actions/setup-sccache/**
      - .github/actions/save-sccache/**
      - .github/scripts/release/compile-desktop.sh
      - .github/scripts/release/pin-path-dep-mtimes.mjs
      - .github/workflows/build-cache-probe.yml

concurrency:
  group: desktop-cache-warmup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/frontend-cache
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: cache-probe-frontend-out
          path: out
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  macos:
    needs: frontend
    name: Compile ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
      CARGO_PROFILE_RELEASE_LTO: "off"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/setup-sccache
        with:
          cache-target: ${{ matrix.target }}
      - id: pathdeps
        name: Pin path dependency mtimes
        run: node .github/scripts/release/pin-path-dep-mtimes.mjs harness/codex
      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: v1-desktop-app
          workspaces: ./src-tauri -> target
          shared-key: desktop-${{ matrix.target }}-${{ steps.pathdeps.outputs.hash }}
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-on-failure: "true"
      - uses: actions/download-artifact@v4
        with:
          name: cache-probe-frontend-out
          path: out
      - name: Stage desktop sidecars
        run: pnpm tauri:prepare-sidecars --target ${{ matrix.target }}
      - name: Verify staged sidecars
        run: node src-tauri/scripts/verify-sidecar-bundle.mjs --target "${{ matrix.target }}"
      - name: Compile application
        timeout-minutes: 130
        env:
          BUILD_TARGET: ${{ matrix.target }}
          IYW_CLAW_SKIP_SIDECAR: "1"
          TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
        run: bash .github/scripts/release/compile-desktop.sh "$BUILD_TARGET"
      - if: always()
        uses: ./.github/actions/build-timings
        with:
          target: ${{ matrix.target }}
      - if: always()
        uses: ./.github/actions/save-sccache

  windows:
    needs: frontend
    name: Compile x86_64-pc-windows-msvc
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
      CARGO_HOME: 'C:\c'
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
      CARGO_PROFILE_RELEASE_LTO: "off"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-sccache
        with:
          cache-target: x86_64-pc-windows-msvc
      - id: pathdeps
        name: Pin path dependency mtimes
        run: node .github/scripts/release/pin-path-dep-mtimes.mjs harness/codex
      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: v1-desktop-app
          workspaces: src-tauri -> target
          shared-key: desktop-x86_64-pc-windows-msvc-${{ steps.pathdeps.outputs.hash }}
          cache-bin: "false"
          cache-workspace-crates: "false"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: cache-probe-frontend-out
          path: out
      - name: Stage sidecars
        run: pnpm tauri:prepare-sidecars --target $env:TAURI_TARGET_TRIPLE
      - name: Compile application
        timeout-minutes: 130
        env:
          IYW_CLAW_SKIP_SIDECAR: "1"
        run: |
          pnpm exec tauri build --target $env:TAURI_TARGET_TRIPLE --features tauri-runtime --config src-tauri/tauri.ci.conf.json --config src-tauri/tauri.compile-only.conf.json --no-bundle --no-sign -- --timings
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed' }
      - name: Verify Windows embedded runtime compatibility
        run: |
          node src-tauri/scripts/prepare-xinghe-worker.mjs --target $env:TAURI_TARGET_TRIPLE
          if ($LASTEXITCODE -ne 0) { throw 'Embedded runtime metadata preparation failed' }
          node src-tauri/scripts/verify-xinghe-worker-bundle.mjs --target $env:TAURI_TARGET_TRIPLE
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime compatibility verification failed' }
      - if: always()
        uses: ./.github/actions/build-timings
        with:
          target: x86_64-pc-windows-msvc
      - if: always()
        uses: ./.github/actions/save-sccache
