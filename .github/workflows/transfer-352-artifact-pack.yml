name: Transfer 0.1.352 Staging Package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Copy staging archive onto the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          src=x64-manifest-pack.zip
          for name in x64-manifest-pack.zip iyw-windows-x86-staging.zip; do
            if gh release view v0.1.352 --json assets --jq '.assets[].name' | grep -qx "$name"; then
              echo "$name already present"
              continue
            fi
            gh release download v0.1.352 --repo "$GH_REPO" --pattern "$src" --dir in --clobber
            sha256sum "in/$src"
            cp "in/$src" "$name"
            gh release upload v0.1.352 "$name"
          done

