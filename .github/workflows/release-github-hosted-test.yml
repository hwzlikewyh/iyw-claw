name: GitHub Hosted Packaging Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test version without v"
        required: true
        type: string
      source_ref:
        description: "Commit, branch, or tag to build"
        required: true
        default: main
        type: string
      platforms:
        description: "Platforms to build"
        required: false
        default: all
        type: choice
        options: [all, windows_x86]
      frontend_run_id:
        description: "Reuse release-frontend-out from this run of the same source"
        required: false
        type: string
      signed_candidate:
        description: Build signed five-platform candidate and keep it as a draft
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: github-hosted-packaging-test-${{ inputs.version }}
  cancel-in-progress: false

env:
  HUSKY: "0"
  RUST_BACKTRACE: short
  TEST_VERSION: ${{ inputs.version }}

jobs:
  prepare-frontend:
    if: inputs.frontend_run_id == ''
    name: Prepare frontend input
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies and set test version
        run: |
          pnpm install --frozen-lockfile
          node scripts/set-version.mjs "$TEST_VERSION"

      - name: Restore frontend compiler cache
        if: hashFiles('.github/actions/frontend-cache/action.yml') != ''
        uses: ./.github/actions/frontend-cache

      - name: Compile frontend
        run: pnpm build

      - name: Upload frontend input
        uses: actions/upload-artifact@v4
        with:
          name: github-hosted-test-frontend-${{ inputs.version }}
          path: out
          if-no-files-found: error
          retention-days: 2

  build-desktop:
    name: Build ${{ matrix.name }} on GitHub hosted
    needs: prepare-frontend
    if: ${{ !inputs.signed_candidate && !cancelled() && (needs.prepare-frontend.result == 'success' || (needs.prepare-frontend.result == 'skipped' && inputs.frontend_run_id != '')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platforms == 'windows_x86' && '{"include":[{"name":"Windows x86","runner":"windows-2022","target":"i686-pc-windows-msvc","bundles":"nsis"}]}' || '{"include":[{"name":"Windows x64","runner":"windows-2022","target":"x86_64-pc-windows-msvc","bundles":"nsis"},{"name":"Windows x86","runner":"windows-2022","target":"i686-pc-windows-msvc","bundles":"nsis"},{"name":"macOS x64","runner":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg"},{"name":"macOS arm64","runner":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"name":"Linux x64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"appimage"}]}') }}
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      CARGO_PROFILE_RELEASE_LTO: thin
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./harness/xinghe-worker -> target
          shared-key: desktop-${{ matrix.target }}
          cache-bin: "false"
          cache-workspace-crates: "true"

      - name: Install Windows x86 assembler
        if: matrix.target == 'i686-pc-windows-msvc'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b
        with:
          version: 2.16.03
          platform: win64

      - name: Install Linux dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Download frontend input
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.frontend_run_id != '' && 'release-frontend-out' || format('github-hosted-test-frontend-{0}', inputs.version) }}
          path: out
          github-token: ${{ github.token }}
          run-id: ${{ inputs.frontend_run_id || github.run_id }}

      - name: Set test version
        shell: bash
        run: node scripts/set-version.mjs "$TEST_VERSION"

      - name: Stage and verify sidecars
        shell: bash
        env:
          IYW_CLAW_BROWSER_SIDECAR_EXCLUDED: ${{ matrix.target == 'i686-pc-windows-msvc' && '1' || '' }}
        run: |
          pnpm tauri:prepare-sidecars --target "${{ matrix.target }}"
          node src-tauri/scripts/verify-sidecar-bundle.mjs --target "${{ matrix.target }}"

      - name: Prepare cached worker resources
        if: hashFiles('.github/actions/prepare-worker/action.yml') != ''
        uses: ./.github/actions/prepare-worker
        with:
          target: ${{ matrix.target }}

      - name: Prepare worker for legacy source
        if: hashFiles('.github/actions/prepare-worker/action.yml') == ''
        run: pnpm tauri:prepare-xinghe-worker --target "${{ matrix.target }}"

      - name: Cache runtime seed archives
        if: matrix.target != 'i686-pc-windows-msvc'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/iyw-runtime-seed-cache
          key: runtime-downloads-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/scripts/runtime-seed-config.mjs') }}
          restore-keys: |
            runtime-downloads-${{ runner.os }}-${{ matrix.target }}-

      - name: Prepare and verify runtime seed
        if: matrix.target != 'i686-pc-windows-msvc'
        shell: bash
        env:
          IYW_CLAW_RUNTIME_SEED_CACHE: ${{ runner.temp }}/iyw-runtime-seed-cache
        run: |
          pnpm tauri:prepare-runtime-seed --target "${{ matrix.target }}"
          pnpm tauri:verify-runtime-seed --target "${{ matrix.target }}"

      - name: Build unsigned desktop bundle
        shell: bash
        env:
          IYW_CLAW_SKIP_SIDECAR: "1"
          TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
        run: >-
          pnpm dlx @tauri-apps/cli@2.11.4 build
          --target "${{ matrix.target }}"
          --features tauri-runtime
          --bundles "${{ matrix.bundles }}"
          --config src-tauri/tauri.ci.conf.json
          ${{ matrix.target == 'i686-pc-windows-msvc' && '--config src-tauri/tauri.windows-x86.conf.json' || '' }}
          ${{ matrix.target != 'i686-pc-windows-msvc' && '--config src-tauri/tauri.runtime-seed.conf.json' || '' }}
          --no-sign -- --timings

      - name: Verify desktop bundle size
        shell: bash
        run: pnpm tauri:verify-bundle-size --target "${{ matrix.target }}"

      - name: Verify macOS runtime seed in app bundle
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: pnpm tauri:verify-runtime-seed-bundle --target "${{ matrix.target }}"

      - name: Upload desktop test bundle
        uses: actions/upload-artifact@v4
        with:
          name: github-hosted-${{ matrix.target }}-${{ inputs.version }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload Windows signing input
        if: contains(matrix.target, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: github-hosted-signing-${{ matrix.target }}-${{ inputs.version }}
          path: |
            out/**
            src-tauri/target/${{ matrix.target }}/release/iyw-claw.exe
            src-tauri/binaries/**
            src-tauri/resources/xinghe-worker/**
            src-tauri/resources/runtime-seed/**
            src-tauri/tauri.runtime-seed.conf.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 1

      - name: Archive Cargo build timings
        if: always() && hashFiles('.github/actions/build-timings/action.yml') != ''
        uses: ./.github/actions/build-timings
        with:
          target: ${{ matrix.target }}

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: sccache --show-stats

  signed-candidate:
    if: inputs.signed_candidate
    needs: prepare-frontend
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-candidate.yml
    with:
      version: ${{ inputs.version }}
      source_ref: ${{ needs.prepare-frontend.outputs.source_sha }}
      frontend_artifact: github-hosted-test-frontend-${{ inputs.version }}
    secrets: inherit
