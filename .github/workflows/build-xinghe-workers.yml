name: Build Xinghe Workers

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_artifacts:
        default: false
        type: boolean
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - harness/xinghe-worker/**
      - harness/codex/**
      - src-tauri/vendor/sacp-tokio/**
      - .cargo/**
      - rust-toolchain*
      - src-tauri/scripts/*xinghe-worker*.mjs
      - .github/actions/prepare-worker/**
      - .github/workflows/build-xinghe-workers.yml

permissions:
  contents: read
  actions: read

jobs:
  worker:
    name: Worker ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, target: x86_64-pc-windows-msvc }
          - { runner: windows-2022, target: i686-pc-windows-msvc }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
      CARGO_PROFILE_RELEASE_LTO: "off"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b
        if: matrix.target == 'i686-pc-windows-msvc'
        with:
          version: 2.16.03
          platform: win64
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Dir::Etc::sourceparts=- update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Configure native Linux arm64 compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR=ar" >> "$GITHUB_ENV"
      - name: Restore or build verified worker
        uses: ./.github/actions/prepare-worker
        with:
          target: ${{ matrix.target }}
          dependency-cache: "true"
      - name: Archive worker for parallel application build
        id: archive
        if: inputs.release_artifacts
        shell: bash
        env:
          WORKER_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/release-worker-$WORKER_TARGET/worker.tar"
          if [[ "$RUNNER_OS" == "Windows" ]]; then archive="$(cygpath -u "$archive")"; fi
          mkdir -p "$(dirname "$archive")"
          tar -cf "$archive" -C "harness/xinghe-worker/target/bundle-cache/$WORKER_TARGET" .
          echo "name=release-worker-$WORKER_TARGET-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload worker for this release
        if: inputs.release_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ runner.temp }}/release-worker-${{ matrix.target }}/worker.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - uses: ./.github/actions/build-timings
        if: always()
        with:
          target: ${{ matrix.target }}
