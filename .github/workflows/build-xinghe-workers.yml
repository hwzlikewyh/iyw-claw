name: Validate Embedded Xinghe Metadata

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_artifacts:
        default: false
        type: boolean
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - harness/xinghe-worker/**
      - harness/codex/**
      - src-tauri/vendor/sacp-tokio/**
      - .cargo/**
      - rust-toolchain*
      - src-tauri/scripts/*xinghe-worker*.mjs
      - .github/actions/prepare-worker/**
      - .github/workflows/build-xinghe-workers.yml

permissions:
  contents: read
  actions: read

jobs:
  worker:
    name: Embedded runtime ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate embedded runtime identity
        uses: ./.github/actions/prepare-worker
        with:
          target: ${{ matrix.target }}
