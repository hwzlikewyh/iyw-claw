name: Publish Fusion Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        type: string
      release_id:
        description: Fusion draft release ID
        required: true
        type: string
      artifact_set:
        description: Artifact set to publish
        required: true
        default: desktop_all
        type: choice
        options:
          - desktop_all
          - windows_x64

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      FUSION_BASE_URL: https://gateway.iyw.cn/iyw-fusion-api
      FUSION_ACCESS_TOKEN: ${{ secrets.FUSION_ACCESS_TOKEN }}
      FUSION_ADMIN_TOKEN: ${{ secrets.FUSION_ADMIN_TOKEN }}
      FUSION_RELEASE_ID: ${{ inputs.release_id }}
      FUSION_VERSION: ${{ inputs.version }}
      FUSION_ARTIFACT_SET: ${{ inputs.artifact_set }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate release credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FUSION_ACCESS_TOKEN"
          test -n "$FUSION_ADMIN_TOKEN"

      - name: Download signed GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="v${FUSION_VERSION}"
          mkdir -p release-assets
          patterns=(
            --pattern "*_${FUSION_VERSION}_x64-setup.exe"
            --pattern "*_${FUSION_VERSION}_x64-setup.exe.sig"
          )
          if [[ "$FUSION_ARTIFACT_SET" == "desktop_all" ]]; then
            patterns+=(
              --pattern "*_${FUSION_VERSION}_amd64.AppImage"
              --pattern "*_${FUSION_VERSION}_amd64.AppImage.sig"
              --pattern "*_x64.app.tar.gz"
              --pattern "*_x64.app.tar.gz.sig"
              --pattern "*_aarch64.app.tar.gz"
              --pattern "*_aarch64.app.tar.gz.sig"
            )
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release-assets "${patterns[@]}"

      - name: Upload artifacts and publish Fusion release
        shell: bash
        run: |
          set -euo pipefail

          api_headers=(
            --header "admin-token: ${FUSION_ADMIN_TOKEN}"
            --header "token: ${FUSION_ACCESS_TOKEN}"
            --header "X-IYW-Admin-Actor: github-actions-fusion-release"
          )

          request() {
            curl --fail-with-body --silent --show-error \
              "${api_headers[@]}" "$@"
          }

          [[ "$FUSION_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          detail_url="$FUSION_BASE_URL/admin/api/app-releases/$FUSION_RELEASE_ID"
          request "$detail_url" | jq -e --arg version "$FUSION_VERSION" '
            .code == 1 and (.data.release | .productKey == "iyw-claw" and .version == $version and
              .channel == "stable" and .updatePolicy == "optional" and .rolloutMode == "manual" and
              .rolloutBasisPoints == 100 and (.status == "draft" or .status == "published"))' > /dev/null

          artifact_path() {
            local suffix="$1"
            local -a matches
            shopt -s nullglob
            matches=(release-assets/*"$suffix")
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one artifact ending in $suffix" >&2
              return 1
            fi
            printf '%s' "${matches[0]}"
          }

          ready_artifact_digest() {
            local target="$1"
            local arch="$2"
            local package_kind="$3"
            request --request GET \
              "$FUSION_BASE_URL/admin/api/app-releases/$FUSION_RELEASE_ID" | jq -er \
              --arg target "$target" \
              --arg arch "$arch" \
              --arg package_kind "$package_kind" \
              'if .code != 1 then error("Failed to read release artifacts") else
                [(.data.artifacts // [])[] | select(.target == $target and .arch == $arch and .packageKind == $package_kind and .status == "ready")] |
                if length == 0 then ""
                elif length == 1 and (.[0].sha256 | type == "string" and length == 64) then .[0].sha256
                else error("Invalid digest or ambiguous ready artifact") end
              end'
          }

          upload_artifact() {
            local target="$1"
            local arch="$2"
            local package_kind="$3"
            local package="$4"
            local signature="$5"
            local size request_file init_file upload_url upload_method
            local digest ready_digest
            local -a upload_headers upload_args

            test -s "$package"
            test -s "$signature"
            size="$(stat --format=%s "$package")"
            digest="$(sha256sum < "$package")"
            digest="${digest%% *}"
            ready_digest="$(ready_artifact_digest "$target" "$arch" "$package_kind")"
            if [[ -n "$ready_digest" ]]; then
              if [[ "$ready_digest" != "$digest" ]]; then
                echo "Ready $target/$arch/$package_kind artifact differs from local package" >&2
                return 1
              fi
              echo "Skipping already verified $target/$arch artifact"
              return 0
            fi
            local pending_id
            pending_id="$(request "$detail_url" | jq -er --arg target "$target" --arg arch "$arch" \
              --arg kind "$package_kind" --arg name "$(basename "$package")" --argjson size "$size" \
              --rawfile signature "$signature" '
              if .code != 1 then error("Failed to read release artifacts") else
              [.data.artifacts[]? | select(.target == $target and .arch == $arch and .packageKind == $kind)] |
              if length == 0 then "" elif length == 1 and (.[0] | .status == "uploading" and
                .fileName == $name and .size == $size and .signature == ($signature | gsub("^\\s+|\\s+$"; "")))
              then .[0].id else error("Staged artifact differs from signed source") end end')"
            if [[ -n "$pending_id" ]]; then
              echo "Waiting for verifier receipt for artifact $pending_id"
              return 0
            fi
            request_file="$(mktemp)"
            init_file="$(mktemp)"

            jq -n \
              --arg runtime desktop \
              --arg target "$target" \
              --arg arch "$arch" \
              --arg package_kind "$package_kind" \
              --arg file_name "$(basename "$package")" \
              --arg content_type application/octet-stream \
              --argjson size "$size" \
              --arg digest "$digest" \
              --rawfile signature "$signature" \
              '{runtime: $runtime, target: $target, arch: $arch, packageKind: $package_kind, fileName: $file_name, contentType: $content_type, size: $size, sha256: $digest, signature: $signature}' \
              > "$request_file"

            request --request POST \
              --header 'Content-Type: application/json' \
              --data-binary "@$request_file" \
              "$FUSION_BASE_URL/admin/api/app-releases/$FUSION_RELEASE_ID/artifacts/init" \
              > "$init_file"
            jq -e '.code == 1 and .data.artifact.id and .data.upload.url and .data.upload.method' "$init_file" > /dev/null

            upload_url="$(jq -r '.data.upload.url' "$init_file")"
            upload_method="$(jq -r '.data.upload.method' "$init_file")"
            [[ "$upload_method" == PUT && "$upload_url" =~ ^https://[a-z0-9-]+\.tos-[a-z0-9-]+\.volces\.com/ ]]
            mapfile -t upload_headers < <(jq -r '.data.upload.headers | to_entries[] | [.key, .value] | @tsv' "$init_file")
            upload_args=(--fail --silent --show-error --request "$upload_method" --upload-file "$package")
            for header in "${upload_headers[@]}"; do
              upload_args+=(--header "${header/$'\t'/: }")
            done
            curl "${upload_args[@]}" "$upload_url"

            echo "Uploaded $target/$arch directly to TOS. Waiting for protected verifier receipt."
            rm -f "$request_file" "$init_file"
          }

          upload_artifact windows x86_64 nsis \
            "$(artifact_path "_${FUSION_VERSION}_x64-setup.exe")" \
            "$(artifact_path "_${FUSION_VERSION}_x64-setup.exe.sig")"
          if [[ "$FUSION_ARTIFACT_SET" == "desktop_all" ]]; then
            upload_artifact linux x86_64 appimage \
              "$(artifact_path "_${FUSION_VERSION}_amd64.AppImage")" \
              "$(artifact_path "_${FUSION_VERSION}_amd64.AppImage.sig")"
            upload_artifact darwin x86_64 app_tar_gz \
              "$(artifact_path '_x64.app.tar.gz')" \
              "$(artifact_path '_x64.app.tar.gz.sig')"
            upload_artifact darwin aarch64 app_tar_gz \
              "$(artifact_path '_aarch64.app.tar.gz')" \
              "$(artifact_path '_aarch64.app.tar.gz.sig')"
          fi

          release_status="$(request "$detail_url" | jq -er '
            if .code == 1 and (.data.artifacts | length > 0 and all(.status == "ready")) then .data.release.status
            else error("Draft is waiting for protected artifact verification. Resume after receipts are submitted.") end')"
          if [[ "$release_status" == published ]]; then exit 0; fi
          [[ "$release_status" == draft ]]
          publish_file="$(mktemp)"
          trap 'rm -f "$publish_file"' EXIT
          request --request POST --header 'Content-Type: application/json' --data '{}' \
            "$FUSION_BASE_URL/admin/api/app-releases/$FUSION_RELEASE_ID/publish" \
            > "$publish_file"
          jq -e --arg id "$FUSION_RELEASE_ID" '.code == 1 and .data.release.id == $id and .data.release.status == "published"' "$publish_file" > /dev/null
          echo "Published Fusion release $FUSION_VERSION"
