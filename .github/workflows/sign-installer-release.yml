name: Sign Installer Release

on:
  workflow_dispatch:
    inputs:
      installer_ref:
        description: Exact 40-character installer source commit
        required: true
        type: string
      release_tag:
        description: Existing installer release tag to update
        required: true
        default: v0.2.3
        type: string
      installer_run_id:
        description: Sign brand artifacts from this successful run; does not publish a release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sign-installer-release
  cancel-in-progress: false

jobs:
  sign-candidates:
    if: inputs.installer_run_id != ''
    uses: ./.github/workflows/sign-brand-installers.yml
    with:
      installer_ref: ${{ inputs.installer_ref }}
      installer_run_id: ${{ inputs.installer_run_id }}
    secrets: inherit
  build-sign-upload:
    if: inputs.installer_run_id == ''
    runs-on: [self-hosted, Windows, X64, iyw-signing]
    timeout-minutes: 60
    concurrency:
      group: windows-signing-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      INSTALLER_TAG: ${{ inputs.release_tag }}
      INSTALLER_SOURCE: ${{ inputs.installer_ref }}
      NO_COLOR: "1"
      CLICOLOR: "0"
      GH_TOKEN: ${{ secrets.INSTALLER_REPO_TOKEN }}
      IYW_CLAW_SIGN_MODE: signtool
      IYW_CLAW_SIGN_REQUIRED: "1"
      IYW_CLAW_SIGN_THUMBPRINT: ${{ vars.WINDOWS_SIGN_THUMBPRINT }}
      IYW_CLAW_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
      IYW_CLAW_SAFENET_PIN: ${{ secrets.IYW_CLAW_SAFENET_PIN }}
    steps:
      - name: Validate immutable installer inputs
        shell: pwsh
        run: |
          if ($env:INSTALLER_SOURCE -notmatch '^[a-fA-F0-9]{40}$') { throw 'Use an exact installer commit' }
          if ($env:INSTALLER_TAG -notmatch '^v0\.2\.\d+$') { throw 'This workflow signs the direct installer 0.2 release line' }
          if ($env:INSTALLER_SOURCE -notmatch '^[a-fA-F0-9]{40}$') { throw 'Use an exact installer commit' }
          if ($env:INSTALLER_TAG -notmatch '^v0\.2\.\d+$') { throw 'This workflow signs the direct installer 0.2 release line' }
                    $draft = gh release view $env:INSTALLER_TAG --repo hwzlikewyh/iyw-claw-installer --json isDraft --jq .isDraft
                    if ($LASTEXITCODE -ne 0 -or $draft.Trim() -ne 'true') { throw 'Sign a published draft; published installers are immutable' }
                    $type = gh api "repos/hwzlikewyh/iyw-claw-installer/git/ref/tags/$env:INSTALLER_TAG" --jq .object.type
                    $hash = gh api "repos/hwzlikewyh/iyw-claw-installer/git/ref/tags/$env:INSTALLER_TAG" --jq .object.sha
                    if ($LASTEXITCODE -ne 0) { throw 'Installer tag lookup failed' }
                    if ($type.Trim() -eq 'tag') { $hash = gh api "repos/hwzlikewyh/iyw-claw-installer/git/tags/$($hash.Trim())" --jq .object.sha }
                    if ($LASTEXITCODE -ne 0 -or $hash.Trim() -ne $env:INSTALLER_SOURCE) { throw 'Installer tag is bound to a different source commit' }
      - name: Checkout installer source
        uses: actions/checkout@v4
        with:
          repository: hwzlikewyh/iyw-claw-installer
          token: ${{ secrets.INSTALLER_REPO_TOKEN }}
          ref: ${{ inputs.installer_ref }}
          path: installer
          clean: true

      - name: Checkout signing tools
        uses: actions/checkout@v4
        with:
          path: signing-tools
          sparse-checkout: |
            src-tauri/scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build unsigned installer package
        shell: pwsh
        working-directory: installer
        run: |
          $uv = (Get-Command uv -ErrorAction Stop).Source
          if ((git rev-parse HEAD).Trim() -ne $env:INSTALLER_SOURCE) { throw 'Installer source mismatch' }
          if (-not (Select-String -LiteralPath CMakeLists.txt -SimpleMatch "VERSION $($env:INSTALLER_TAG.Substring(1)) ")) { throw 'Installer version does not match draft tag' }
          & $uv run --python 3.12 --no-project python scripts/fetch-deps.py
          if ($LASTEXITCODE -ne 0) { throw 'dependency preparation failed' }
          ./scripts/build.ps1 -WxSource .cache/wxWidgets-3.2.12
          if ($LASTEXITCODE -ne 0) { throw 'installer build failed' }
          & $uv run --python 3.12 --no-project python scripts/package.py windows
          if ($LASTEXITCODE -ne 0) { throw 'installer packaging failed' }

      - name: Sign and verify Windows files
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:IYW_CLAW_SAFENET_PIN)) { throw 'SafeNet PIN secret is missing' }
          if (($env:IYW_CLAW_SIGN_THUMBPRINT -replace '[\s:]', '') -notmatch '^[a-fA-F0-9]{40}$') { throw 'Windows signing thumbprint is missing or invalid' }
          $signer = Join-Path $env:GITHUB_WORKSPACE 'signing-tools/src-tauri/scripts/sign-staged-windows.mjs'
          $node = (Get-Command node -ErrorAction Stop).Source
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE 'installer/packages'
          $exe = Join-Path $packageRoot 'YuanAssistant-Setup-windows.exe'
          $zip = Join-Path $packageRoot 'YuanAssistant-Setup-windows.zip'
          & $node $signer $exe
          if ($LASTEXITCODE -ne 0) { throw 'standalone installer signing failed' }

          $extract = Join-Path $env:RUNNER_TEMP "iyw-installer-signed-zip-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $inner = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter '原助理安装向导.exe')
          if ($inner.Count -ne 1) { throw "expected one executable in Windows ZIP, found $($inner.Count)" }
          Copy-Item -LiteralPath $exe -Destination $inner[0].FullName -Force
          $zipTemp = Join-Path $packageRoot 'signed-windows.zip'
          Compress-Archive -Path (Join-Path $extract '*') -DestinationPath $zipTemp -CompressionLevel Optimal
          Move-Item -LiteralPath $zipTemp -Destination $zip -Force

          $expectedThumbprint = ($env:IYW_CLAW_SIGN_THUMBPRINT -replace '[\s:]', '').ToUpperInvariant()
          foreach ($file in @($exe, $inner[0].FullName)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            $actualThumbprint = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint.ToUpperInvariant() } else { '' }
            if ($signature.Status -ne 'Valid' -or $actualThumbprint -ne $expectedThumbprint -or -not $signature.TimeStamperCertificate) {
              throw "Authenticode verification failed: $file (status=$($signature.Status), thumbprint=$actualThumbprint)"
            }
          }

          $sumLines = foreach ($name in @('YuanAssistant-Setup-windows.exe', 'YuanAssistant-Setup-windows.zip')) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $packageRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [System.IO.File]::WriteAllText((Join-Path $packageRoot 'SHA256SUMS.txt'), (($sumLines -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          Get-Content (Join-Path $packageRoot 'SHA256SUMS.txt')

      - name: Sign installer for automatic updates
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Updater signing key is missing' }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'installer/packages/YuanAssistant-Setup-windows.exe'
          npx --yes '@tauri-apps/cli@2.11.4' signer sign $exe
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath "$exe.sig")) { throw 'Installer updater signing failed' }

      - name: Upload signed release assets
        shell: pwsh
        working-directory: installer
        run: |
          gh release upload "$env:INSTALLER_TAG" packages/YuanAssistant-Setup-windows.exe packages/YuanAssistant-Setup-windows.exe.sig packages/YuanAssistant-Setup-windows.zip packages/SHA256SUMS.txt --repo hwzlikewyh/iyw-claw-installer --clobber

      - name: Upload signed build artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-installer-windows-${{ inputs.release_tag }}
          path: installer/packages/*
          if-no-files-found: error
          retention-days: 7
