name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "New release version without v (for example 0.0.2)"
        required: true
        type: string

env:
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: release
        name: Prepare release version and tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG_FROM_PUSH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "::error::Version '$version' must be semantic version text without a leading v."
              exit 1
            fi

            tag="v$version"
            tag_exists=false
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              tag_exists=true
              draft="$(gh release view "$tag" --repo "$REPOSITORY" --json isDraft --jq '.isDraft')"
              if [[ "$draft" != "true" ]]; then
                echo "::error::Release tag $tag already exists and is not a draft."
                exit 1
              fi
            fi

            node scripts/set-version.mjs "$version"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock \
              src-tauri/tauri.conf.json src-tauri/tauri.windows.conf.json \
              src-tauri/tauri.windows-x86.conf.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): v$version"
            fi
            source_ref="$(git rev-parse HEAD)"
            if [[ "$tag_exists" == true ]]; then
              git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
              tag_ref="$(git rev-list -n 1 "$tag^{commit}")"
              if [[ "$tag_ref" != "$source_ref" ]]; then
                echo "::error::Draft tag $tag points to $tag_ref, but this release source is $source_ref. Refusing to mix assets from different commits."
                exit 1
              fi
              echo "Reusing existing draft tag $tag at source commit $source_ref."
            else
              git tag -a "$tag" -m "Release $tag"
            fi
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
            if [[ "$tag_exists" == false ]]; then
              git push origin "refs/tags/$tag"
            fi
          else
            tag="$RELEASE_TAG_FROM_PUSH"
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  create-draft-release:
    needs: prepare-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_url: ${{ steps.release.outputs.release_url }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      release_body: ${{ steps.release.outputs.release_body }}
      source_ref: ${{ needs.prepare-release.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_ref }}
          fetch-depth: 0

      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-workflow
          sparse-checkout: .github/scripts/release
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - id: resolve
        name: Validate tag and project versions
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .release-workflow/.github/scripts/release/resolve-release.sh

      - name: Validate signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash .release-workflow/.github/scripts/release/validate-secrets.sh

      - id: release
        name: Create or reuse draft release
        uses: actions/github-script@v7
        env:
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        with:
          script: |
            const createOrReuseDraft = require(
              "./.release-workflow/.github/scripts/release/create-draft-release.cjs"
            );
            await createOrReuseDraft({
              github,
              context,
              core,
              tag: process.env.RELEASE_TAG,
              prerelease: process.env.PRERELEASE === "true",
            });

  prepare-frontend:
    needs: create-draft-release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-draft-release.outputs.source_ref || needs.create-draft-release.outputs.release_tag }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: release-frontend-out
          path: out
          if-no-files-found: error
          retention-days: 1

  build-tauri:
    needs:
      - create-draft-release
      - prepare-frontend
    permissions:
      contents: write
    uses: ./.github/workflows/release-tauri.yml
    with:
      release_id: ${{ needs.create-draft-release.outputs.release_id }}
      release_tag: ${{ needs.create-draft-release.outputs.release_tag }}
      release_body: ${{ needs.create-draft-release.outputs.release_body }}
      source_ref: ${{ needs.create-draft-release.outputs.source_ref }}
      prerelease: ${{ needs.create-draft-release.outputs.prerelease == 'true' }}
    secrets: inherit

  build-server:
    needs:
      - create-draft-release
      - prepare-frontend
    permissions:
      contents: write
    uses: ./.github/workflows/release-server.yml
    with:
      release_tag: ${{ needs.create-draft-release.outputs.release_tag }}
      source_ref: ${{ needs.create-draft-release.outputs.source_ref }}
    secrets: inherit

  publish-release:
    needs:
      - create-draft-release
      - build-tauri
      - build-server
    if: ${{ needs.build-tauri.result == 'success' && needs.build-server.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-workflow
          sparse-checkout: .github/scripts/release
          sparse-checkout-cone-mode: false

      - name: Upload updater manifest (latest.json)
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.create-draft-release.outputs.release_tag }}
          RELEASE_BODY: ${{ needs.create-draft-release.outputs.release_body }}
        with:
          script: |
            const uploadUpdaterJson = require(
              "./.release-workflow/.github/scripts/release/upload-updater-json.cjs"
            );
            await uploadUpdaterJson({
              github,
              context,
              core,
              tag: process.env.RELEASE_TAG,
              releaseId: Number(process.env.RELEASE_ID),
              notes: process.env.RELEASE_BODY || "",
            });

      - name: Publish draft release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
          PRERELEASE: ${{ needs.create-draft-release.outputs.prerelease }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const prerelease = process.env.PRERELEASE === "true";

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
              prerelease,
            });

            core.info(`Published release #${releaseId}`);
