name: Release Tauri Bundles

on:
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_ref:
        required: false
        type: string
        default: ""
      release_body:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      frontend_artifact:
        required: false
        type: string
        default: release-frontend-out
      build_matrix:
        required: false
        type: string
        default: '{"include":[{"name":"macOS x64","runner":"macos-26-intel","target":"x86_64-apple-darwin","codegen_units":"16","lto":"false","optional":false},{"name":"macOS arm64","runner":"macos-latest","target":"aarch64-apple-darwin","codegen_units":"16","lto":"false","optional":false},{"name":"Linux x64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","codegen_units":"8","lto":"thin","optional":false},{"name":"Windows x64","runner":["self-hosted","Windows","X64","iyw-signing"],"target":"x86_64-pc-windows-msvc","codegen_units":"8","lto":"thin","optional":false},{"name":"Windows 32-bit","runner":["self-hosted","Windows","X64","iyw-signing"],"target":"i686-pc-windows-msvc","codegen_units":"8","lto":"thin","optional":false}]}'
      release_draft:
        required: false
        type: boolean
        default: true
      browser_engine_fixture:
        required: false
        type: string
        default: ""

env:
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  build:
    name: Build ${{ matrix.name }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.optional }}
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      # macOS uses parallel codegen without LTO because its hosted runners are
      # the slowest release builders. Other targets keep thin LTO for size and
      # runtime optimization.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.codegen_units }}
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ contains(toJSON(matrix.runner), 'self-hosted') && 'false' || 'true' }}
      HTTP_PROXY: ${{ contains(toJSON(matrix.runner), 'iyw-signing') && 'http://127.0.0.1:7890' || '' }}
      HTTPS_PROXY: ${{ contains(toJSON(matrix.runner), 'iyw-signing') && 'http://127.0.0.1:7890' || '' }}
      NO_PROXY: ${{ contains(toJSON(matrix.runner), 'iyw-signing') && 'localhost,127.0.0.1,api.github.com,uploads.github.com' || (contains(matrix.target, 'windows') && '.actions.githubusercontent.com,.blob.core.windows.net' || '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag }}
          # A persistent self-hosted runner keeps target/ between matrix jobs.
          # Hosted runners remain clean because their workspaces are ephemeral.
          clean: ${{ !contains(toJSON(matrix.runner), 'self-hosted') }}
          fetch-depth: 1

      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-workflow
          sparse-checkout: .github/scripts/release
          sparse-checkout-cone-mode: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure persistent self-hosted caches
        if: contains(toJSON(matrix.runner), 'self-hosted')
        shell: bash
        run: |
          set -euo pipefail
          cache_root="${RUNNER_TOOL_CACHE:-$HOME/.cache}/iyw-claw"
          mkdir -p "$cache_root/sccache" "$cache_root/pnpm-store" \
            "$cache_root/runtime-seed/${{ matrix.target }}"
          {
            echo "SCCACHE_DIR=$cache_root/sccache"
            echo "IYW_CLAW_RUNTIME_SEED_CACHE=$cache_root/runtime-seed/${{ matrix.target }}"
          } >> "$GITHUB_ENV"
          pnpm config set store-dir "$cache_root/pnpm-store"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"
          fi
          echo "[cache] persistent root: $cache_root"

      - name: Configure hosted runtime seed cache
        if: ${{ !contains(toJSON(matrix.runner), 'self-hosted') }}
        shell: bash
        run: echo "IYW_CLAW_RUNTIME_SEED_CACHE=${RUNNER_TEMP}/iyw-runtime-seed-cache" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - id: worker-toolchain
        name: Identify worker build toolchain
        shell: bash
        run: |
          set -euo pipefail
          identity="$(rustc --version --verbose)"
          hash="$(printf '%s' "$identity" | sha256sum | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Rust cache
        if: ${{ !contains(toJSON(matrix.runner), 'self-hosted') }}
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./harness/xinghe-worker -> target
          shared-key: ${{ matrix.target }}

      - id: worker-cache
        name: Restore exact worker resources
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/resources/xinghe-worker
          key: xinghe-${{ runner.os }}-${{ matrix.target }}-${{ steps.worker-toolchain.outputs.hash }}-${{ matrix.codegen_units }}-${{ matrix.lto }}-${{ hashFiles('harness/xinghe-worker/Cargo.toml', 'harness/xinghe-worker/Cargo.lock', 'harness/xinghe-worker/src/**', 'harness/codex/Cargo.toml', 'harness/codex/upstream.lock', 'harness/codex/src/**', 'harness/codex/patches/**', 'src-tauri/vendor/sacp-tokio/**', 'src-tauri/scripts/prepare-xinghe-worker.mjs', 'src-tauri/scripts/verify-xinghe-worker-bundle.mjs', 'src-tauri/scripts/xinghe-worker-binary.mjs', '.cargo/config.toml') }}

      - name: Clear stale worker resources
        if: steps.worker-cache.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf src-tauri/resources/xinghe-worker

      - name: Install Windows x86 assembler
        if: matrix.target == 'i686-pc-windows-msvc'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b
        with:
          version: 2.16.03
          platform: win64

      - name: Verify Windows x86 assembler
        if: matrix.target == 'i686-pc-windows-msvc'
        shell: pwsh
        run: |
          nasm -v
          if ($LASTEXITCODE -ne 0) { throw 'NASM version check failed' }

      - name: Install Linux x64 dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Linux arm64 cross dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: bash .release-workflow/.github/scripts/release/setup-linux-arm64.sh desktop

      - name: Verify Linux arm64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          command -v aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc -v
          rustup target list --installed

      - name: Clear stale frontend output on self-hosted runner
        if: ${{ contains(toJSON(matrix.runner), 'self-hosted') }}
        shell: bash
        run: |
          node -e "require('node:fs').rmSync('out', { recursive: true, force: true })"

      - name: Clear previous Windows bundles on signing runner
        if: contains(toJSON(matrix.runner), 'iyw-signing')
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          node -e 'const fs=require("node:fs"),path=require("node:path");const root=path.resolve("src-tauri/target");const target=process.env.BUILD_TARGET;if(!/^[a-z0-9_-]+$/.test(target))throw new Error("invalid target");const output=path.resolve(root,target,"release/bundle");if(!output.startsWith(root+path.sep))throw new Error("bundle path escapes target directory");fs.rmSync(output,{recursive:true,force:true});'

      - name: Download frontend build contents
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.frontend_artifact }}
          path: out
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      # Must run BEFORE sidecar staging so the optional third-party browser
      # controller and the Tauri build inherit the same signing configuration.
      # The built-in MCP runs in the main process and has no sidecar binary.
      # Exports via $GITHUB_ENV so the staging and build steps below inherit the
      # configuration without repeating it.
      - name: Configure Windows Authenticode signing
        if: contains(matrix.target, 'windows')
        id: signing
        shell: bash
        env:
          # Empty when the secret/variable is not set. Every read below uses a
          # `:-` default so `set -u` does not abort on an unconfigured repo.
          SIGN_THUMBPRINT: ${{ contains(toJSON(matrix.runner), 'self-hosted') && vars.WINDOWS_SIGN_THUMBPRINT || '' }}
          SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          SIGN_AZURE_METADATA: ${{ secrets.WINDOWS_SIGN_AZURE_METADATA }}
          SIGN_AZURE_DLIB: ${{ secrets.WINDOWS_SIGN_AZURE_DLIB }}
          SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          set -euo pipefail

          # Written to $GITHUB_ENV rather than passed inline to the build step:
          # one source of truth, and every later step (staging, build, verify)
          # inherits the same configuration automatically.
          if [ -n "${SIGN_THUMBPRINT:-}" ]; then
            {
              echo "IYW_CLAW_SIGN_MODE=signtool"
              echo "IYW_CLAW_SIGN_REQUIRED=1"
              echo "IYW_CLAW_SIGN_THUMBPRINT=${SIGN_THUMBPRINT}"
            } >> "$GITHUB_ENV"
            mode=signtool

          elif [ -n "${SIGN_AZURE_METADATA:-}" ]; then
            # Azure Artifact Signing (formerly Trusted Signing): the private key
            # stays in Microsoft's HSM, so there is no .pfx to handle here.
            if [ -z "${SIGN_AZURE_DLIB:-}" ]; then
              echo "::error::WINDOWS_SIGN_AZURE_METADATA is set but WINDOWS_SIGN_AZURE_DLIB is not. Install the Trusted Signing client in an earlier step and point WINDOWS_SIGN_AZURE_DLIB at Azure.CodeSigning.Dlib.dll."
              exit 1
            fi
            metadata="${RUNNER_TEMP}/azure-signing-metadata.json"
            printf '%s' "${SIGN_AZURE_METADATA}" > "${metadata}"
            {
              echo "IYW_CLAW_SIGN_MODE=azure"
              echo "IYW_CLAW_SIGN_AZURE_DLIB=${SIGN_AZURE_DLIB}"
              echo "IYW_CLAW_SIGN_AZURE_METADATA=${metadata}"
            } >> "$GITHUB_ENV"
            mode=azure

          elif [ -n "${SIGN_PFX_BASE64:-}" ]; then
            pfx="${RUNNER_TEMP}/windows-signing.pfx"
            printf '%s' "${SIGN_PFX_BASE64}" | base64 --decode > "${pfx}"
            {
              echo "IYW_CLAW_SIGN_MODE=pfx"
              echo "IYW_CLAW_SIGN_PFX=${pfx}"
              echo "IYW_CLAW_SIGN_PFX_PASSWORD=${SIGN_PFX_PASSWORD:-}"
            } >> "$GITHUB_ENV"
            mode=pfx

          else
            echo "::warning::No Windows code-signing certificate is configured, so this build ships UNSIGNED. Unsigned installers trip SmartScreen and are flagged by antivirus heuristics. Set WINDOWS_SIGN_THUMBPRINT, WINDOWS_SIGN_PFX_BASE64 (+ WINDOWS_SIGN_PFX_PASSWORD), or WINDOWS_SIGN_AZURE_METADATA/_DLIB to enable signing."
            # `config_arg` must still be defined: the build step interpolates it
            # into `args`, where an unset output would render as the literal
            # empty string only by luck of expression evaluation.
            {
              echo "mode=none"
              echo "config_arg="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${SIGN_TIMESTAMP_URL:-}" ]; then
            echo "IYW_CLAW_SIGN_TIMESTAMP_URL=${SIGN_TIMESTAMP_URL}" >> "$GITHUB_ENV"
          fi

          # The overlay embeds an absolute path to sign-windows.mjs, so it has to
          # be generated on the runner rather than committed. It reads
          # IYW_CLAW_SIGN_MODE, which only lands in the environment for the *next*
          # step — pass it explicitly for this one invocation.
          config="$(IYW_CLAW_SIGN_MODE="${mode}" node src-tauri/scripts/prepare-signing-config.mjs)"
          {
            echo "mode=${mode}"
            echo "config_arg=--config ${config}"
          } >> "$GITHUB_OUTPUT"

      - name: Preflight hardware signing
        if: contains(toJSON(matrix.runner), 'iyw-signing')
        shell: pwsh
        run: |
          if ($env:IYW_CLAW_SIGN_MODE -ne 'signtool') { throw 'Hardware signing was not configured' }
          $probe = Join-Path $env:RUNNER_TEMP ("iyw-release-signing-" + [guid]::NewGuid().ToString('N') + '.exe')
          try {
            Copy-Item -LiteralPath (Get-Command node).Source -Destination $probe
            node src-tauri/scripts/sign-staged-windows.mjs $probe
            if ($LASTEXITCODE -ne 0) { throw 'Hardware signing preflight failed' }
          } finally { Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue }

      - name: Stage desktop sidecars
        shell: bash
        env:
          IYW_CLAW_BROWSER_SIDECAR_EXCLUDED: ${{ matrix.target == 'i686-pc-windows-msvc' && '1' || '' }}
        run: pnpm tauri:prepare-sidecars --target ${{ matrix.target }}

      - name: Verify staged sidecars
        run: node src-tauri/scripts/verify-sidecar-bundle.mjs --target "${{ matrix.target }}"

      - name: Build built-in worker
        if: steps.worker-cache.outputs.cache-hit != 'true'
        run: pnpm tauri:prepare-xinghe-worker --target "${{ matrix.target }}"

      - name: Verify built-in worker resources
        run: node src-tauri/scripts/verify-xinghe-worker-bundle.mjs --target "${{ matrix.target }}"

      - name: Save exact worker resources
        if: steps.worker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/resources/xinghe-worker
          key: ${{ steps.worker-cache.outputs.cache-primary-key }}

      - name: Run managed browser smoke
        if: inputs.browser_engine_fixture != '' && matrix.target != 'i686-pc-windows-msvc'
        shell: bash
        env:
          IYW_CLAW_REQUIRED_BROWSER_SMOKE: "1"
          IYW_CLAW_BROWSER_ENGINE: ${{ inputs.browser_engine_fixture }}
        run: |
          sidecar="src-tauri/binaries/agent-browser-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then sidecar+=".exe"; fi
          pnpm tauri:browser-smoke -- --sidecar "$sidecar" --engine "$IYW_CLAW_BROWSER_ENGINE"

      - name: Cache runtime seed archives
        if: ${{ !contains(toJSON(matrix.runner), 'self-hosted') && matrix.target != 'i686-pc-windows-msvc' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/iyw-runtime-seed-cache
          key: runtime-seed-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/scripts/*runtime-seed*.mjs', 'src-tauri/runtime-seed/codex/package-lock.json') }}

      - name: Prepare runtime seed
        shell: bash
        run: pnpm tauri:prepare-runtime-seed --target ${{ matrix.target }}

      - name: Verify runtime seed
        shell: bash
        run: pnpm tauri:verify-runtime-seed --target ${{ matrix.target }}

      - name: Build and upload Linux arm64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          IYW_CLAW_SKIP_SIDECAR: "1"
          # agent-browser is a pinned vendor binary. Its exact source hash and
          # size are verified before and after bundling; do not require a
          # second Authenticode signature on that byte-identical sidecar.
          TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ inputs.release_id }}
          tagName: ${{ inputs.release_tag }}
          releaseBody: ${{ inputs.release_body }}
          releaseDraft: ${{ inputs.release_draft }}
          prerelease: ${{ inputs.prerelease }}
          tauriScript: pnpm dlx @tauri-apps/cli@2.11.4
          args: --target ${{ matrix.target }} --features tauri-runtime --bundles deb,rpm --config src-tauri/tauri.ci.conf.json ${{ matrix.target != 'i686-pc-windows-msvc' && '--config src-tauri/tauri.runtime-seed.conf.json' || '' }} --config src-tauri/tauri.linux-arm64-ci.conf.json
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Verify Linux arm64 bundle size
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: pnpm tauri:verify-bundle-size --target "${{ matrix.target }}"

      - name: Build and upload Windows
        if: contains(matrix.target, 'windows')
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          IYW_CLAW_SKIP_SIDECAR: "1"
          TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Authenticode config (IYW_CLAW_SIGN_*) arrives via $GITHUB_ENV from the
          # "Configure Windows Authenticode signing" step. Note this is unrelated
          # to TAURI_SIGNING_PRIVATE_KEY above, which is the updater's minisign
          # key — different mechanism, different trust chain.
        with:
          releaseId: ${{ inputs.release_id }}
          tagName: ${{ inputs.release_tag }}
          releaseBody: ${{ inputs.release_body }}
          releaseDraft: ${{ inputs.release_draft }}
          prerelease: ${{ inputs.prerelease }}
          tauriScript: pnpm dlx @tauri-apps/cli@2.11.4
          # steps.signing.outputs.config_arg is either empty (unsigned) or
          # `--config <abs path to generated overlay>`.
          args: --target ${{ matrix.target }} --features tauri-runtime --bundles nsis --config src-tauri/tauri.ci.conf.json ${{ matrix.target == 'i686-pc-windows-msvc' && '--config src-tauri/tauri.windows-x86.conf.json' || '' }} ${{ matrix.target != 'i686-pc-windows-msvc' && '--config src-tauri/tauri.runtime-seed.conf.json' || '' }} ${{ steps.signing.outputs.config_arg }}
          # latest.json is generated by the publish-release job in release.yml
          # from the actual release assets (tauri-action's name matching breaks
          # on the non-ASCII productName).
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Verify Windows bundle size
        if: contains(matrix.target, 'windows')
        shell: bash
        run: pnpm tauri:verify-bundle-size --target "${{ matrix.target }}"

      # Signing silently covering only some first-party artifacts is the failure
      # mode worth catching. The pinned agent-browser vendor binary is verified
      # by exact size and SHA-256 in the staging step and is excluded here.
      - name: Verify Authenticode signatures
        if: contains(matrix.target, 'windows')
        shell: bash
        run: |
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          if [ "${{ steps.signing.outputs.mode }}" = "none" ]; then
            node src-tauri/scripts/verify-signatures.mjs --warn "$bundle_root"/*-setup.exe
          else
            node src-tauri/scripts/verify-signatures.mjs "$bundle_root"/*-setup.exe
          fi

      # 签名机可能安装着正式应用，实际安装校验交给干净的 hosted runner。
      - name: Upload signed Windows verification input
        if: contains(matrix.target, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-verification-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/resources/xinghe-worker/*
            src-tauri/binaries/agent-browser-${{ matrix.target }}.exe
          if-no-files-found: error
          retention-days: 1

      # Runs even on failure: the decrypted .pfx holds the private key and must
      # not outlive the job on a self-hosted runner. Paths must stay in sync with
      # the "Configure Windows Authenticode signing" step above.
      - name: Remove signing material
        if: always() && contains(matrix.target, 'windows')
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/windows-signing.pfx"
          rm -f "${RUNNER_TEMP}/azure-signing-metadata.json"

      - name: Build and upload Linux x64
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          IYW_CLAW_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ inputs.release_id }}
          tagName: ${{ inputs.release_tag }}
          releaseBody: ${{ inputs.release_body }}
          releaseDraft: ${{ inputs.release_draft }}
          prerelease: ${{ inputs.prerelease }}
          tauriScript: pnpm dlx @tauri-apps/cli@2.11.4
          args: --target ${{ matrix.target }} --features tauri-runtime --bundles appimage --config src-tauri/tauri.ci.conf.json ${{ matrix.target != 'i686-pc-windows-msvc' && '--config src-tauri/tauri.runtime-seed.conf.json' || '' }}
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Verify Linux x64 bundle size
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: pnpm tauri:verify-bundle-size --target "${{ matrix.target }}"

      - name: Build ad-hoc and upload macOS
        if: contains(matrix.target, 'apple-darwin')
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          IYW_CLAW_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ inputs.release_id }}
          tagName: ${{ inputs.release_tag }}
          releaseBody: ${{ inputs.release_body }}
          releaseDraft: ${{ inputs.release_draft }}
          prerelease: ${{ inputs.prerelease }}
          tauriScript: pnpm dlx @tauri-apps/cli@2.11.4
          args: --target ${{ matrix.target }} --features tauri-runtime --bundles app,dmg --config src-tauri/tauri.ci.conf.json ${{ matrix.target != 'i686-pc-windows-msvc' && '--config src-tauri/tauri.runtime-seed.conf.json' || '' }}
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Verify macOS bundle size
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: pnpm tauri:verify-bundle-size --target "${{ matrix.target }}"

      - name: Verify macOS runtime seed in app bundle
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: pnpm tauri:verify-runtime-seed-bundle --target "${{ matrix.target }}"

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats
