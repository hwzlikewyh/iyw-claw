name: Re-sign Existing Windows Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft version, without v
        required: true
        type: string
      build_run_id:
        description: Original Release workflow run providing immutable staging and macOS builds
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: resign-windows-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      source: ${{ steps.inputs.outputs.source }}
      release: ${{ steps.inputs.outputs.release }}
      asset: ${{ steps.inputs.outputs.asset }}
      sha256: ${{ steps.inputs.outputs.sha256 }}
    steps:
      - id: inputs
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
          BUILD_RUN: ${{ inputs.build_run_id }}
        with:
          script: |
            const version=process.env.VERSION, runId=Number(process.env.BUILD_RUN);
            if(!/^\d+\.\d+\.\d+$/.test(version)||!Number.isSafeInteger(runId)||runId<=0)throw new Error('Invalid release input');
            const tag=`v${version}`;
            const source=(await github.rest.repos.getCommit({...context.repo,ref:tag})).data.sha;
            const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});
            const release=releases.find(item=>item.tag_name===tag&&item.draft);
            if(!release)throw new Error('Existing unpublished draft required');
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId})).data;
            if(run.path!=='.github/workflows/release.yml'||run.display_title!==`Release ${tag}`)throw new Error('Original release run mismatch');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:runId,per_page:100});
            if(!jobs.some(job=>job.name==='build-windows (x86_64-pc-windows-msvc) / build'&&job.conclusion==='success'))throw new Error('Original Windows build has not succeeded');
            const prefix=`iyw-staging-${runId}-`;
            const assets=release.assets.filter(asset=>asset.name.startsWith(prefix)&&asset.name.endsWith('-x86_64-pc-windows-msvc.zip'));
            if(assets.length!==1||!/^sha256:[a-f0-9]{64}$/.test(assets[0].digest||''))throw new Error('Exactly one verified staging asset required');
            core.setOutput('source',source);core.setOutput('release',release.id);
            core.setOutput('asset',assets[0].id);core.setOutput('sha256',assets[0].digest.slice(7));
  sign:
    needs: resolve
    runs-on: [self-hosted, Windows, X64, iyw-signing]
    timeout-minutes: 60
    concurrency:
      group: windows-signing-${{ github.repository }}
      cancel-in-progress: false
    env:
      TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
      SOURCE_REF: ${{ needs.resolve.outputs.source }}
      RELEASE_ID: ${{ needs.resolve.outputs.release }}
      RELEASE_TAG: v${{ inputs.version }}
      STAGING_ASSET_ID: ${{ needs.resolve.outputs.asset }}
      STAGING_SHA256: ${{ needs.resolve.outputs.sha256 }}
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: "1"
      CLICOLOR: "0"
      IYW_CLAW_SIGN_MODE: signtool
      IYW_CLAW_SIGN_REQUIRED: "1"
      IYW_CLAW_SIGN_THUMBPRINT: ${{ vars.WINDOWS_SIGN_THUMBPRINT }}
      IYW_CLAW_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
      IYW_CLAW_SAFENET_PIN: ${{ secrets.IYW_CLAW_SAFENET_PIN }}
      IYW_CLAW_SKIP_SIDECAR: "1"
      TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      NO_PROXY: localhost,127.0.0.1,api.github.com,uploads.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source }}
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            .github/scripts/release
            src-tauri/scripts
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Prepare existing bundle inputs
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          if ($LASTEXITCODE -ne 0) { throw 'Bundler dependencies failed' }
          "IYW_CLAW_STAGING_DIR=$env:RUNNER_TEMP/resign-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_ENV
      - id: download
        shell: pwsh
        run: node .release-tools/.github/scripts/release/windows-release.mjs download
      - shell: pwsh
        env:
          ARCHIVE: ${{ steps.download.outputs.archive }}
        run: Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath $env:IYW_CLAW_STAGING_DIR
      - name: Prepare signed direct installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.INSTALLER_REPO_TOKEN }}
        run: ./.release-tools/.github/scripts/release/prepare-direct-installer.ps1 -Tag v0.2.0
      - name: Repackage and sign existing executable without compiling
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node .release-tools/.github/scripts/release/windows-release.mjs finalize
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-verification-x86_64-pc-windows-msvc
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/iyw-claw.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*_${{ inputs.version }}_x64-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/direct/*
            src-tauri/resources/xinghe-worker/*
            src-tauri/binaries/iyw-environment-x86_64-pc-windows-msvc.exe
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
  verify:
    needs: [resolve, sign]
    uses: ./.github/workflows/release-windows-verification.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source }}
      artifact_run_id: ${{ github.run_id }}
