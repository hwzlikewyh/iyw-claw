name: Re-sign Existing Windows Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft version, without v
        required: true
        type: string
      build_run_id:
        description: Original Release workflow run providing immutable staging and macOS builds
        required: true
        type: string
      signed_run_id:
        description: Reuse signed draft assets from a completed sign job; skip signing
        required: false
        type: string
      refresh_bootstrapper:
        description: Sign only the independently downloaded installer; keep app assets unchanged
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: resign-windows-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      source: ${{ steps.inputs.outputs.source }}
      release: ${{ steps.inputs.outputs.release }}
      asset: ${{ steps.inputs.outputs.asset }}
      sha256: ${{ steps.inputs.outputs.sha256 }}
    steps:
      - id: inputs
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          SIGNED_RUN: ${{ inputs.signed_run_id }}
        with:
          script: |
            const version=process.env.VERSION, runId=Number(process.env.BUILD_RUN);
            if(!/^\d+\.\d+\.\d+$/.test(version)||!Number.isSafeInteger(runId)||runId<=0)throw new Error('Invalid release input');
            const tag=`v${version}`;
            const source=(await github.rest.repos.getCommit({...context.repo,ref:tag})).data.sha;
            const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});
            const release=releases.find(item=>item.tag_name===tag&&item.draft);
            if(!release)throw new Error('Existing unpublished draft required');
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId})).data;
            if(run.path!=='.github/workflows/release.yml'||run.display_title!==`Release ${tag}`)throw new Error('Original release run mismatch');
            if(process.env.SIGNED_RUN){
              const signedId=Number(process.env.SIGNED_RUN);
              if(!Number.isSafeInteger(signedId)||signedId<=0)throw new Error('Invalid signing run');
              const signed=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:signedId})).data;
              if(signed.path!=='.github/workflows/release-resign-windows.yml'||signed.status!=='completed')throw new Error('Signing workflow identity mismatch');
              const signedJobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:signedId,per_page:100});
              if(!signedJobs.some(job=>job.name==='sign'&&job.conclusion==='success'))throw new Error('Signing job has not succeeded');
            }
            for(;;){
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:runId,per_page:100});
              const build=jobs.find(job=>job.name==='build-windows (x86_64-pc-windows-msvc) / build');
              if(build?.conclusion==='success')break;
              if(build?.status==='completed')throw new Error('Original Windows build failed');
              const current=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId})).data;
              if(current.status==='completed')throw new Error('Original release did not produce a Windows build');
              core.info('Waiting for the existing Windows build; no new compilation is started');
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            const ready=(await github.rest.repos.getRelease({...context.repo,release_id:release.id})).data;
            const prefix=`iyw-staging-${runId}-`;
            const assets=ready.assets.filter(asset=>asset.name.startsWith(prefix)&&asset.name.endsWith('-x86_64-pc-windows-msvc.zip'));
            if(assets.length!==1||!/^sha256:[a-f0-9]{64}$/.test(assets[0].digest||''))throw new Error('Exactly one verified staging asset required');
            core.setOutput('source',source);core.setOutput('release',release.id);
            core.setOutput('asset',assets[0].id);core.setOutput('sha256',assets[0].digest.slice(7));
  sign:
    needs: resolve
    if: ${{ inputs.signed_run_id == '' || inputs.refresh_bootstrapper }}
    runs-on: [self-hosted, Windows, X64, iyw-signing]
    timeout-minutes: 60
    concurrency:
      group: windows-signing-${{ github.repository }}
      cancel-in-progress: false
    env:
      TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
      SOURCE_REF: ${{ needs.resolve.outputs.source }}
      RELEASE_ID: ${{ needs.resolve.outputs.release }}
      RELEASE_TAG: v${{ inputs.version }}
      STAGING_ASSET_ID: ${{ needs.resolve.outputs.asset }}
      STAGING_SHA256: ${{ needs.resolve.outputs.sha256 }}
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: "1"
      CLICOLOR: "0"
      IYW_CLAW_SIGN_MODE: signtool
      IYW_CLAW_SIGN_REQUIRED: "1"
      IYW_CLAW_SIGN_THUMBPRINT: ${{ vars.WINDOWS_SIGN_THUMBPRINT }}
      IYW_CLAW_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
      IYW_CLAW_SAFENET_PIN: ${{ secrets.IYW_CLAW_SAFENET_PIN }}
      IYW_CLAW_SKIP_SIDECAR: "1"
      TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      NO_PROXY: localhost,127.0.0.1,api.github.com,uploads.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source }}
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            .github/scripts/release
            src-tauri/scripts
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Prepare existing bundle inputs
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          if ($LASTEXITCODE -ne 0) { throw 'Bundler dependencies failed' }
          "IYW_CLAW_STAGING_DIR=$env:RUNNER_TEMP/resign-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_ENV
      - id: download
        if: ${{ !inputs.refresh_bootstrapper }}
        shell: pwsh
        run: node .release-tools/.github/scripts/release/windows-release.mjs download
      - shell: pwsh
        if: ${{ !inputs.refresh_bootstrapper }}
        env:
          ARCHIVE: ${{ steps.download.outputs.archive }}
        run: Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath $env:IYW_CLAW_STAGING_DIR
      - name: Prepare signed direct installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.INSTALLER_REPO_TOKEN }}
        run: ./.release-tools/.github/scripts/release/prepare-direct-installer.ps1 -Tag v0.2.3
      - name: Repackage and sign existing executable without compiling
        if: ${{ !inputs.refresh_bootstrapper }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node .release-tools/.github/scripts/release/windows-release.mjs finalize
      - name: Refresh only the standalone installer
        if: inputs.refresh_bootstrapper
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node --input-type=module -e 'import {publishBootstrapper} from "./.release-tools/.github/scripts/release/windows-payload-release.mjs"; await publishBootstrapper({root:process.cwd(), version:process.env.RELEASE_TAG.slice(1), context:{repo:process.env.GITHUB_REPOSITORY,releaseId:process.env.RELEASE_ID,tag:process.env.RELEASE_TAG}})'
          if ($LASTEXITCODE -ne 0) { throw 'Standalone installer publication failed' }
  verify-direct-fresh:
    needs: [resolve, sign]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .verification-tools
      - name: Install into an empty profile
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ needs.resolve.outputs.source }}
          GH_TOKEN: ${{ github.token }}
          IYW_CLAW_SIGN_THUMBPRINT: ${{ vars.WINDOWS_SIGN_THUMBPRINT }}
          NO_COLOR: "1"
          GH_COLOR: never
          GH_FORCE_TTY: "0"
          CLICOLOR_FORCE: "0"
          TERM: dumb
        run: ./.verification-tools/.github/scripts/release/verify-direct-release.ps1 -Scenario Fresh
      - name: Report installer diagnostics
        if: failure()
        shell: pwsh
        run: |
          $root=Join-Path ([Environment]::GetFolderPath('UserProfile')) '.iyw-claw/logs'
          Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object Name -in 'installer-error.log','last-error.log','environment-prepare.log.stderr' |
            ForEach-Object { Write-Output $_.Name; Get-Content -LiteralPath $_.FullName -Tail 80 }
  verify-direct-legacy:
    needs: [resolve, sign]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .verification-tools
      - name: Upgrade previous NSIS installation and preserve its data
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ needs.resolve.outputs.source }}
          GH_TOKEN: ${{ github.token }}
          IYW_CLAW_SIGN_THUMBPRINT: ${{ vars.WINDOWS_SIGN_THUMBPRINT }}
          NO_COLOR: "1"
          GH_COLOR: never
          GH_FORCE_TTY: "0"
          CLICOLOR_FORCE: "0"
          TERM: dumb
        run: ./.verification-tools/.github/scripts/release/verify-direct-release.ps1 -Scenario Legacy
      - name: Report installer diagnostics
        if: failure()
        shell: pwsh
        run: |
          $root=Join-Path ([Environment]::GetFolderPath('UserProfile')) '.iyw-claw/logs'
          Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object Name -in 'installer-error.log','last-error.log','environment-prepare.log.stderr' |
            ForEach-Object { Write-Output $_.Name; Get-Content -LiteralPath $_.FullName -Tail 80 }
  publish:
    needs: [resolve, sign, verify-direct-fresh, verify-direct-legacy]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.verify-direct-fresh.result == 'success' && needs.verify-direct-legacy.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/github-script@v7
        env:
          BUILD_RUN: ${{ inputs.build_run_id }}
          RELEASE_ID: ${{ needs.resolve.outputs.release }}
          SOURCE_REF: ${{ needs.resolve.outputs.source }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const runId=Number(process.env.BUILD_RUN),releaseId=Number(process.env.RELEASE_ID);
            const tag=`v${process.env.VERSION}`,source=process.env.SOURCE_REF;
            const required=['build-windows (x86_64-pc-windows-msvc) / build','build-tauri / Build macOS arm64',
              'build-macos-x64 / Build macOS x64','verify-macos-x64-installer / verify'];
            for(;;){
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:runId,per_page:100});
              const selected=required.map(name=>jobs.find(job=>job.name===name));
              for(const job of selected)if(job?.status==='completed'&&job.conclusion!=='success')throw new Error(`${job.name} failed`);
              if(selected.every(job=>job?.conclusion==='success'))break;
              const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId})).data;
              if(run.status==='completed')throw new Error('Original build lacks required macOS or source verification');
              core.info('Waiting for original macOS build and installation checks');
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            const helpers=await import(`${process.cwd()}/.github/scripts/release/github-assets.mjs`);
            const repo=`${context.repo.owner}/${context.repo.repo}`;
            const release=helpers.requireReleaseSource({repo,releaseId,tag,sourceRef:source});
            for(const suffix of ['x64-app-payload.zip','x64-bootstrapper.exe']){
              const name=`iyw-claw_${process.env.VERSION}_${suffix}`;
              for(const expected of [name,`${name}.sig`]){
                const assets=release.assets.filter(asset=>asset.name===expected&&asset.state==='uploaded'&&asset.size>0);
                if(assets.length!==1||!/^sha256:[a-f0-9]{64}$/.test(assets[0].digest||''))throw new Error(`Missing verified direct asset: ${expected}`);
              }
            }
            await helpers.cleanupStaging({repo,releaseId,tag});
            const updater=require('./.github/scripts/release/upload-updater-json.cjs');
            await updater({github,context,core,tag,releaseId,notes:release.body||''});
            await updater.assertPublishableReleaseAssets({github,context,core,releaseId});
            await github.rest.repos.updateRelease({...context.repo,release_id:releaseId,draft:false,prerelease:false});
