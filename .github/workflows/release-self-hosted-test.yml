name: Self-hosted Release Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test version without v (for example 0.1.119-beta.1)"
        required: true
        type: string
      source_ref:
        description: "Commit, branch, or tag to build"
        required: true
        default: main
        type: string

concurrency:
  group: self-hosted-release-test-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"
  RUST_BACKTRACE: short
  TEST_VERSION: ${{ inputs.version }}
  SOURCE_REF: ${{ inputs.source_ref }}

jobs:
  prepare-frontend:
    name: Prepare frontend input
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set test version
        shell: bash
        run: pnpm install --frozen-lockfile && node scripts/set-version.mjs "$TEST_VERSION"

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend input
        uses: actions/upload-artifact@v4
        with:
          name: self-hosted-test-frontend-${{ inputs.version }}
          path: out
          if-no-files-found: error
          retention-days: 2

  build-windows:
    name: Windows ${{ matrix.target }} on self-hosted
    needs: prepare-frontend
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            bundle: nsis
          - target: i686-pc-windows-msvc
            bundle: nsis
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Show runner
        shell: pwsh
        run: |
          Write-Host "runner.name=${env:RUNNER_NAME}"
          Write-Host "runner.os=${env:RUNNER_OS}"
          Write-Host "runner.arch=${env:RUNNER_ARCH}"

      - name: Detect usable Node.js
        id: node_check
        shell: pwsh
        run: |
          $version = $null
          try { $version = (& node --version 2>$null).Trim() } catch {}
          if ($version -match '^v(2[0-9]|[3-9][0-9])\.') {
            Write-Host "Using preinstalled Node.js $version"
            "ready=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Node.js 20+ is unavailable; setup-node will install Node.js 24"
            "ready=false" >> $env:GITHUB_OUTPUT
          }

      - name: Setup Node
        if: steps.node_check.outputs.ready != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Verify Windows build prerequisites
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere)) {
            throw 'Visual Studio Installer (vswhere.exe) is missing. Install Visual Studio Build Tools with the C++ workload and Windows SDK on this runner.'
          }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsPath) {
            throw 'MSVC C++ build tools are missing. Install Microsoft.VisualStudio.Component.VC.Tools.x86.x64 and the Windows 10/11 SDK.'
          }
          Write-Host "MSVC installation: $vsPath"

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set test version
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          node scripts/set-version.mjs "$env:TEST_VERSION"

      - name: Download frontend input
        uses: actions/download-artifact@v4
        with:
          name: self-hosted-test-frontend-${{ inputs.version }}
          path: out

      - name: Prepare sidecars
        shell: pwsh
        run: pnpm tauri:prepare-sidecars --target ${{ matrix.target }}

      - name: Prepare runtime seed
        shell: pwsh
        env:
          IYW_CLAW_RUNTIME_SEED_CACHE: ${{ runner.temp }}\iyw-runtime-seed-cache
        run: pnpm tauri:prepare-runtime-seed --target ${{ matrix.target }}

      - name: Build unsigned bundle
        shell: pwsh
        run: >-
          pnpm dlx @tauri-apps/cli@2.11.4 build
          --target ${{ matrix.target }}
          --features tauri-runtime
          --bundles ${{ matrix.bundle }}
          --config src-tauri/tauri.ci.conf.json
          ${{ matrix.target != 'i686-pc-windows-msvc' && '--config src-tauri/tauri.runtime-seed.conf.json' || '' }}
          --no-sign

      - name: Upload Windows test bundle
        uses: actions/upload-artifact@v4
        with:
          name: self-hosted-test-windows-${{ matrix.target }}-${{ inputs.version }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 2

  build-macos:
    name: macOS ${{ matrix.target }} on self-hosted
    needs: prepare-frontend
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            bundle: app,dmg
          - target: x86_64-apple-darwin
            bundle: app,dmg
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Show runner
        shell: bash
        run: |
          echo "runner.name=${RUNNER_NAME}"
          echo "runner.os=${RUNNER_OS}"
          echo "runner.arch=${RUNNER_ARCH}"

      - name: Detect usable Node.js
        id: node_check
        shell: bash
        run: |
          if command -v node >/dev/null 2>&1 && node --version | grep -Eq '^v(2[0-9]|[3-9][0-9])\.'; then
            echo "Using preinstalled $(node --version)"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Node.js 20+ is unavailable; setup-node will install Node.js 24"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.node_check.outputs.ready != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Verify macOS build prerequisites
        shell: bash
        run: |
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version
          if [[ "${{ matrix.target }}" == "x86_64-apple-darwin" && "$(uname -m)" == "arm64" ]]; then
            if ! /usr/bin/pgrep -q oahd; then
              echo "::warning::Rosetta 2 is not running; x86_64 macOS bundling may fail. Install it with: softwareupdate --install-rosetta --agree-to-license"
            fi
          fi

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set test version
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          node scripts/set-version.mjs "$TEST_VERSION"

      - name: Download frontend input
        uses: actions/download-artifact@v4
        with:
          name: self-hosted-test-frontend-${{ inputs.version }}
          path: out

      - name: Prepare sidecars
        shell: bash
        run: pnpm tauri:prepare-sidecars --target ${{ matrix.target }}

      - name: Prepare runtime seed
        shell: bash
        env:
          IYW_CLAW_RUNTIME_SEED_CACHE: ${{ runner.temp }}/iyw-runtime-seed-cache
        run: pnpm tauri:prepare-runtime-seed --target ${{ matrix.target }}

      - name: Build unsigned bundle
        shell: bash
        run: >-
          pnpm dlx @tauri-apps/cli@2.11.4 build
          --target ${{ matrix.target }}
          --features tauri-runtime
          --bundles ${{ matrix.bundle }}
          --config src-tauri/tauri.ci.conf.json
          --config src-tauri/tauri.runtime-seed.conf.json
          --no-sign

      - name: Upload macOS test bundle
        uses: actions/upload-artifact@v4
        with:
          name: self-hosted-test-macos-${{ matrix.target }}-${{ inputs.version }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 2
