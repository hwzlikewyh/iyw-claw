name: Self-hosted Release Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test version without v (for example 0.1.119-beta.1)"
        required: true
        type: string
      source_ref:
        description: "Commit, branch, or tag to build"
        required: true
        default: main
        type: string

concurrency:
  group: self-hosted-release-test-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"
  RUST_BACKTRACE: short
  TEST_VERSION: ${{ inputs.version }}
  SOURCE_REF: ${{ inputs.source_ref }}

jobs:
  prepare-frontend:
    name: Prepare frontend input
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set test version
        shell: bash
        run: pnpm install --frozen-lockfile && node scripts/set-version.mjs "$TEST_VERSION"

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend input
        uses: actions/upload-artifact@v4
        with:
          name: self-hosted-test-frontend-${{ inputs.version }}
          path: out
          if-no-files-found: error
          retention-days: 2

  build-windows:
    name: Windows ${{ matrix.target }} on self-hosted
    needs: prepare-frontend
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            bundle: nsis
          - target: i686-pc-windows-msvc
            bundle: nsis
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Show runner
        shell: pwsh
        run: |
          Write-Host "runner.name=${env:RUNNER_NAME}"
          Write-Host "runner.os=${env:RUNNER_OS}"
          Write-Host "runner.arch=${env:RUNNER_ARCH}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set test version
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          node scripts/set-version.mjs "$env:TEST_VERSION"

      - name: Download frontend input
        uses: actions/download-artifact@v4
        with:
          name: self-hosted-test-frontend-${{ inputs.version }}
          path: out

      - name: Prepare sidecars
        shell: pwsh
        run: pnpm tauri:prepare-sidecars --target ${{ matrix.target }}

      - name: Prepare runtime seed
        shell: pwsh
        env:
          IYW_CLAW_RUNTIME_SEED_CACHE: ${{ runner.temp }}\iyw-runtime-seed-cache
        run: pnpm tauri:prepare-runtime-seed --target ${{ matrix.target }}

      - name: Build unsigned bundle
        shell: pwsh
        run: >-
          pnpm dlx @tauri-apps/cli@2.11.4 build
          --target ${{ matrix.target }}
          --features tauri-runtime
          --bundles ${{ matrix.bundle }}
          --config src-tauri/tauri.ci.conf.json
          ${{ matrix.target != 'i686-pc-windows-msvc' && '--config src-tauri/tauri.runtime-seed.conf.json' || '' }}
          --no-sign

      - name: Upload Windows test bundle
        uses: actions/upload-artifact@v4
        with:
          name: self-hosted-test-windows-${{ matrix.target }}-${{ inputs.version }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 2

  build-macos:
    name: macOS ${{ matrix.target }} on self-hosted
    needs: prepare-frontend
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            bundle: app,dmg
          - target: x86_64-apple-darwin
            bundle: app,dmg
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Show runner
        shell: bash
        run: |
          echo "runner.name=${RUNNER_NAME}"
          echo "runner.os=${RUNNER_OS}"
          echo "runner.arch=${RUNNER_ARCH}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set test version
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          node scripts/set-version.mjs "$TEST_VERSION"

      - name: Download frontend input
        uses: actions/download-artifact@v4
        with:
          name: self-hosted-test-frontend-${{ inputs.version }}
          path: out

      - name: Prepare sidecars
        shell: bash
        run: pnpm tauri:prepare-sidecars --target ${{ matrix.target }}

      - name: Prepare runtime seed
        shell: bash
        env:
          IYW_CLAW_RUNTIME_SEED_CACHE: ${{ runner.temp }}/iyw-runtime-seed-cache
        run: pnpm tauri:prepare-runtime-seed --target ${{ matrix.target }}

      - name: Build unsigned bundle
        shell: bash
        run: >-
          pnpm dlx @tauri-apps/cli@2.11.4 build
          --target ${{ matrix.target }}
          --features tauri-runtime
          --bundles ${{ matrix.bundle }}
          --config src-tauri/tauri.ci.conf.json
          --config src-tauri/tauri.runtime-seed.conf.json
          --no-sign

      - name: Upload macOS test bundle
        uses: actions/upload-artifact@v4
        with:
          name: self-hosted-test-macos-${{ matrix.target }}-${{ inputs.version }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 2
