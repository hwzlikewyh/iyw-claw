name: Complete Signed Candidate
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      prior_run:
        required: true
        type: string
      release_id:
        required: true
        type: string
jobs:
  linux:
    uses: ./.github/workflows/release-tauri.yml
    with:
      release_id: ${{ inputs.release_id }}
      release_tag: v${{ inputs.version }}
      source_ref: ${{ inputs.source_ref }}
      release_body: Signed build candidate
      prerelease: true
      frontend_artifact: github-hosted-test-frontend-${{ inputs.version }}
      frontend_run_id: ${{ inputs.prior_run }}
      build_matrix: '{"include":[{"name":"Linux x64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","codegen_units":"8","lto":"thin","optional":false}]}'
    secrets: inherit
  wait-original:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/github-script@v7
        env:
          PRIOR_RUN: ${{ inputs.prior_run }}
          SOURCE: ${{ inputs.source_ref }}
          RELEASE_ID: ${{ inputs.release_id }}
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const run_id=Number(process.env.PRIOR_RUN);
            const source=(await github.rest.actions.getWorkflowRun({...context.repo,run_id})).data;
            const release=(await github.rest.repos.getRelease({...context.repo,release_id:Number(process.env.RELEASE_ID)})).data;
            if(source.head_sha!==process.env.SOURCE || release.target_commitish!==process.env.SOURCE || !release.draft || release.tag_name!==`v${process.env.VERSION}`) throw new Error('Candidate source mismatch');
            const names=['signed-candidate / desktop / Build macOS x64','signed-candidate / desktop / Build macOS arm64','signed-candidate / verify-windows / Verify installed x86_64-pc-windows-msvc','signed-candidate / verify-windows / Verify installed i686-pc-windows-msvc'];
            while(true) {
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id,per_page:100});
              const selected=names.map(name=>jobs.find(job=>job.name===name));
              if(selected.some(job=>job?.status==='completed' && job.conclusion!=='success')) throw new Error('An original required job failed');
              if(selected.every(job=>job?.conclusion==='success')) break;
              const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id})).data;
              if(run.status==='completed') throw new Error('Original run ended without all required jobs');
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
  verify-macos:
    needs: wait-original
    uses: ./.github/workflows/release-macos-verification.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      artifact_run_id: ${{ inputs.prior_run }}
  finish:
    needs: [linux, verify-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          node --input-type=module -e 'import{cleanupStaging}from"./.github/scripts/release/github-assets.mjs";cleanupStaging({repo:process.env.GITHUB_REPOSITORY,releaseId:process.env.RELEASE_ID,tag:process.env.RELEASE_TAG});'
